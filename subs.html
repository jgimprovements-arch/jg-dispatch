<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script src="jg-version-check.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JG Restoration — Subcontractors</title>
<link rel="icon" type="image/png" href="https://jgimprovements-arch.github.io/jg-dispatch/logo.png">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="auth.js?v=20260419-1"></script>
<script src="sidebar.js?v=20260419-1"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>

<script>if(!window.supabase||!window.supabase.createClient){document.write('<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"><\/script>');}</script>
<style>
:root{
  --navy:#0d2d5e;--orange:#e85d04;--gold:#f5a623;
  --bg:#f0ede8;--s1:#faf9f7;--s2:#f0ede8;--s3:#e8e4df;
  --brd:rgba(13,45,94,.12);--brdH:rgba(13,45,94,.3);
  --surface:#faf9f7;--border:rgba(13,45,94,.12);--muted:#6b7a96;
  --acc:#e85d04;--txt:#0d1f3c;--dim:#6b7a96;--mut:#a0abbf;
  --red:#c02020;--redD:rgba(192,32,32,.08);
  --grn:#2e7d32;--grnD:rgba(46,125,50,.08);
  --wrn:#e65100;--wrnD:rgba(230,81,0,.08);--ok:#2e7d32;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font-family:'DM Sans',system-ui,sans-serif;min-height:100vh;}
.mono{font-family:'DM Mono',monospace}
.admin-hdr{background:var(--navy);padding:14px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:95;}
.hdr-title{font-size:16px;font-weight:700;color:#fff;display:flex;align-items:center;gap:10px;}
.hdr-title span{font-size:20px;}
.hdr-btn{padding:8px 14px;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;background:rgba(255,255,255,.1);color:rgba(255,255,255,.8);border:1px solid rgba(255,255,255,.2);}
.hdr-btn:hover{background:rgba(255,255,255,.18);color:#fff;}
.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin-bottom:18px;}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px 16px;box-shadow:0 1px 4px rgba(13,45,94,.05);cursor:pointer;transition:border-color .15s;}
.stat-card:hover{border-color:var(--brdH);}
.stat-card.on{border-color:var(--orange);box-shadow:0 0 0 2px rgba(232,93,4,.15);}
.stat-val{font-family:'DM Mono',monospace;font-size:26px;font-weight:600;color:var(--navy);line-height:1;}
.stat-lbl{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-top:4px;}
.wrap{max-width:1160px;margin:0 auto;padding:18px 16px 90px;}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px;}
input,select,textarea{font-family:'DM Sans',sans-serif;font-size:13px;padding:9px 11px;border:1px solid var(--brd);border-radius:8px;background:#fff;color:var(--txt);width:100%;}
textarea{resize:vertical;min-height:60px;}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brdH);}
.btn{background:var(--navy);color:#fff;border:0;border-radius:8px;padding:9px 15px;font-size:13px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;white-space:nowrap;}
.btn:hover{background:#12386f;}
.btn.acc{background:var(--orange);}.btn.acc:hover{filter:brightness(.95);}
.btn.ghost{background:#fff;color:var(--navy);border:1px solid var(--brd);}
.btn.ghost:hover{border-color:var(--brdH);}
.btn.sm{padding:6px 11px;font-size:12px;}
.btn.danger{background:#fff;color:var(--red);border:1px solid rgba(192,32,32,.3);}
.btn.danger:hover{background:var(--redD);}
.tbl-wrap{background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden;box-shadow:0 1px 4px rgba(13,45,94,.05);}
table{width:100%;border-collapse:collapse;font-size:13px;}
thead th{text-align:left;padding:11px 14px;font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);background:var(--s3);border-bottom:1px solid var(--border);white-space:nowrap;}
tbody td{padding:11px 14px;border-bottom:1px solid var(--border);vertical-align:middle;}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover{background:rgba(13,45,94,.02);}
.co{font-weight:700;color:var(--navy);}
.sub-sub{font-size:11px;color:var(--muted);}
.tcell a{color:var(--navy);text-decoration:none;}
.tcell a:hover{text-decoration:underline;}
.rowact{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap;}
.badge{font-family:'DM Mono',monospace;font-size:9px;font-weight:500;padding:2px 8px;border-radius:20px;text-transform:uppercase;letter-spacing:.05em;}
.badge.active{background:var(--grnD);color:var(--grn);}
.badge.inactive{background:#e8e4df;color:#7a879b;}
.trade-tag{display:inline-block;font-size:10px;font-weight:600;padding:2px 8px;border-radius:6px;background:rgba(13,45,94,.06);color:var(--navy);}
.empty{color:var(--muted);text-align:center;padding:50px 0;font-size:14px;}
.section-hdr{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:4px 0 14px;font-family:'DM Mono',monospace;display:flex;align-items:center;gap:8px;}
.section-hdr::after{content:'';flex:1;height:1px;background:var(--border);}
.modal-back{position:fixed;inset:0;background:rgba(13,29,60,.5);display:none;align-items:flex-start;justify-content:center;z-index:600;padding:24px 12px;overflow:auto;}
.modal-back.on{display:flex;}
.modal{background:#fff;border-radius:12px;width:100%;max-width:580px;padding:20px 22px;box-shadow:0 20px 60px rgba(13,29,60,.25);}
.modal h2{font-size:16px;color:var(--navy);margin-bottom:14px;}
.frow{margin-bottom:11px;}
.frow label{display:block;font-size:11px;font-weight:600;color:var(--dim);text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px;}
.frow .req{color:var(--orange);}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:11px;}
.f3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:11px;}
.chk{display:flex;align-items:center;gap:8px;}
.chk input{width:auto;}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;align-items:center;}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:11px 20px;border-radius:10px;font-size:13px;font-weight:600;z-index:800;opacity:0;transition:opacity .2s;pointer-events:none;}
.toast.on{opacity:1;}
.gate{background:#fff;border:1px solid var(--brd);border-radius:12px;padding:26px;text-align:center;max-width:420px;margin:70px auto;}
.gate h1{font-size:18px;color:var(--navy);margin-bottom:6px;}
.hint{font-size:11px;color:var(--muted);margin-top:3px;}
@media(max-width:600px){.f2,.f3{grid-template-columns:1fr;}.hide-sm{display:none;}}
</style>
</head>
<body>
<div id="app" style="display:none">
  <div class="admin-hdr">
    <div class="hdr-title"><span>🧰</span> Subcontractor Directory</div>
    <button class="hdr-btn" onclick="boot()">↻ Refresh</button>
  </div>
  <div class="wrap">
    <div class="stat-row" id="statRow"></div>
    <div class="toolbar">
      <input id="search" placeholder="Search company, contact, phone, trade..." style="max-width:340px">
      <select id="activeFilter" style="max-width:190px">
        <option value="active">Active only</option>
        <option value="">All (incl. inactive)</option>
        <option value="inactive">Inactive only</option>
      </select>
      <button class="btn acc" id="addBtn" style="margin-left:auto;">+ Add Sub</button>
    </div>
    <div class="section-hdr" id="listHdr">Directory</div>
    <div class="tbl-wrap" id="tblWrap"></div>
  </div>
</div>

<div class="gate" id="gate">
  <h1>🧰 Subcontractors</h1>
  <p style="color:var(--muted);font-size:13px;margin-bottom:8px;">Sign in with your JG admin account.</p>
  <p id="gateMsg" style="color:var(--red);font-size:13px;"></p>
  <div class="frow" style="text-align:left;margin-top:10px;"><label>Admin email</label><input id="emailInput" placeholder="you@jg-restoration.com"></div>
  <button class="btn acc" id="gateBtn" style="width:100%;">Continue</button>
</div>

<!-- Add / Edit modal -->
<div class="modal-back" id="editModal">
  <div class="modal">
    <h2 id="editTitle">Add Subcontractor</h2>
    <div class="frow">
      <label>Company name <span class="req">*</span></label>
      <input id="fCompany" placeholder="e.g. J. Owen Construction">
      <div class="hint">This is what shows first in the WO Builder assignee list.</div>
    </div>
    <div class="frow">
      <label>Primary contact</label>
      <input id="fContact" placeholder="e.g. Jeremy Owen">
      <div class="hint">The person's name — shown after the company (Company · Contact).</div>
    </div>
    <div class="f2">
      <div class="frow"><label>Phone</label><input id="fPhone" placeholder="(920) 555-0100"></div>
      <div class="frow"><label>Email</label><input id="fEmail" placeholder="name@example.com"></div>
    </div>
    <div class="f2">
      <div class="frow">
        <label>Primary trade</label>
        <input id="fTrade" list="tradeList" placeholder="e.g. Flooring">
        <datalist id="tradeList">
          <option value="Flooring"></option><option value="Roofing"></option><option value="Siding"></option>
          <option value="Drywall"></option><option value="Painting"></option><option value="Plumbing"></option>
          <option value="Electrical"></option><option value="HVAC"></option><option value="Framing / Carpentry"></option>
          <option value="Concrete"></option><option value="Insulation"></option><option value="Cleaning"></option>
          <option value="Demolition"></option><option value="General"></option>
        </datalist>
      </div>
      <div class="frow">
        <label>Market</label>
        <select id="fMarket">
          <option value="">— Any / unspecified —</option>
          <option value="appleton">Appleton</option>
          <option value="stevens_point">Stevens Point</option>
          <option value="both">Both</option>
        </select>
      </div>
    </div>
    <div class="frow"><label>Notes</label><textarea id="fNotes" placeholder="Optional — licensing, specialties, rate notes, etc."></textarea></div>
    <div class="frow"><div class="chk"><input type="checkbox" id="fActive" checked><label style="margin:0;text-transform:none;font-size:13px;font-weight:600;color:var(--txt);">Active (shows in the WO Builder assignee list)</label></div></div>
    <div class="modal-actions">
      <button class="btn danger sm" id="delBtn" style="margin-right:auto;display:none;" onclick="delSub()">Delete</button>
      <button class="btn ghost" onclick="closeModal('editModal')">Cancel</button>
      <button class="btn acc" id="saveBtn" onclick="saveSub()">Save</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const SB_URL='https://nuykvchgecpiuikoerze.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im51eWt2Y2hnZWNwaXVpa29lcnplIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYyNjM3ODYsImV4cCI6MjA5MTgzOTc4Nn0.39hZ8DdjT_0iFJXPeAL2FXUSLw8FZBirDVzxZTO1W9s';
// Roles allowed in — same set the Fleet page uses.
const SUB_ROLES=['admin','office','project manager'];
// Fallback for pure-Google admin accounts that may not have an employees row.
const ADMIN_EMAILS=['josh@jg-restoration.com','josh.greil@jg-restoration.com','lisa@jg-restoration.com','jgimprovements@gmail.com'];
let sb=null,ME=null,IS_ADMIN=false,SUBS=[],EDIT_ID=null;

// Multi-role aware: employees.role is comma-separated ("Office, Admin"), so
// split and check for overlap rather than exact-matching the whole string.
function _hasSubRole(roleStr){
  return String(roleStr||'').split(',').map(r=>r.trim().toLowerCase()).filter(Boolean).some(r=>SUB_ROLES.indexOf(r)!==-1);
}
async function _isAdmin(email){
  if(ADMIN_EMAILS.indexOf(email)!==-1) return true;
  try{
    const c=window.supabase.createClient(SB_URL,SB_KEY);
    const {data}=await c.from('employees').select('role,active').or('email.eq.'+email+',personal_email.eq.'+email).limit(1);
    const emp=data&&data[0];
    if(!emp||emp.active===false) return false;
    return String(emp.role||'').split(',').map(r=>r.trim().toLowerCase()).some(r=>r==='admin');
  }catch(err){ return false; }
}
async function _emailAllowed(email){
  if(ADMIN_EMAILS.indexOf(email)!==-1) return true;   // hardcoded admins always in
  try{
    const c=window.supabase.createClient(SB_URL,SB_KEY);
    const {data}=await c.from('employees').select('role,active').or('email.eq.'+email+',personal_email.eq.'+email).limit(1);
    const emp=data&&data[0];
    if(emp&&emp.active!==false&&_hasSubRole(emp.role)) return true;
  }catch(err){/* fall through to deny */}
  return false;
}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),2600);}
function closeModal(id){document.getElementById(id).classList.remove('on');}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function detectEmail(){try{const r=localStorage.getItem('jg_platform_user')||localStorage.getItem('jg_tc_user');if(r){const u=JSON.parse(r);return u&&u.email?String(u.email).toLowerCase():null;}}catch(e){}return null;}
function openGate(msg){document.getElementById('gate').style.display='block';document.getElementById('app').style.display='none';if(msg)document.getElementById('gateMsg').textContent=msg;const p=detectEmail();if(p)document.getElementById('emailInput').value=p;}
async function tryEnter(email){email=String(email||'').trim().toLowerCase();if(!email)return openGate('Enter your email.');const ok=await _emailAllowed(email);if(!ok)return openGate('Your account does not have access. Contact the office.');ME=email;IS_ADMIN=await _isAdmin(email);document.getElementById('gate').style.display='none';document.getElementById('app').style.display='block';await boot();}

async function boot(){
  if(!window.supabase||!window.supabase.createClient){toast('Database library blocked - check tracking prevention');return;}
  sb=window.supabase.createClient(SB_URL,SB_KEY);
  await loadSubs();
  render();
}

// select('*') so we never error on a column that may not exist in this schema.
async function loadSubs(){
  const {data,error}=await sb.from('rebuild_subs').select('*').order('company_name');
  if(error){toast('Load failed: '+error.message);SUBS=[];return;}
  SUBS=data||[];
}

function marketLabel(m){
  m=String(m||'').toLowerCase();
  if(m==='appleton')return'Appleton';
  if(m==='stevens_point'||m==='stevenspoint')return'Stevens Point';
  if(m==='both')return'Both';
  return m?esc(m):'';
}

function filtered(){
  const q=document.getElementById('search').value.trim().toLowerCase();
  const af=document.getElementById('activeFilter').value;
  return SUBS.filter(s=>{
    const active=s.active!==false;
    if(af==='active'&&!active)return false;
    if(af==='inactive'&&active)return false;
    if(q){
      const hay=[s.company_name,s.primary_contact,s.phone,s.email,s.primary_trade,s.market,s.notes].map(x=>String(x||'').toLowerCase()).join(' ');
      if(hay.indexOf(q)===-1)return false;
    }
    return true;
  });
}

function renderStats(){
  const total=SUBS.length;
  const active=SUBS.filter(s=>s.active!==false).length;
  const inactive=total-active;
  const thin=SUBS.filter(s=>s.active!==false&&!String(s.primary_contact||'').trim()).length;
  const cards=[
    {v:active,l:'Active'},
    {v:inactive,l:'Inactive'},
    {v:total,l:'Total'},
    {v:thin,l:'Missing contact'}
  ];
  document.getElementById('statRow').innerHTML=cards.map(c=>
    '<div class="stat-card"><div class="stat-val">'+c.v+'</div><div class="stat-lbl">'+c.l+'</div></div>'
  ).join('');
}

function render(){
  renderStats();
  const rows=filtered();
  document.getElementById('listHdr').textContent='Directory · '+rows.length+' shown';
  if(!rows.length){
    document.getElementById('tblWrap').innerHTML='<div class="empty">No subcontractors match. Add one with <b>+ Add Sub</b>.</div>';
    return;
  }
  const body=rows.map(s=>{
    const active=s.active!==false;
    const contact=String(s.primary_contact||'').trim();
    const contactCell=contact?esc(contact):'<span class="sub-sub">— no contact —</span>';
    const phone=String(s.phone||'').trim();
    const email=String(s.email||'').trim();
    const trade=String(s.primary_trade||'').trim();
    const mkt=marketLabel(s.market);
    return '<tr>'+
      '<td class="tcell"><div class="co">'+esc(s.company_name||'(unnamed)')+'</div></td>'+
      '<td class="tcell">'+contactCell+'</td>'+
      '<td class="tcell hide-sm">'+(phone?'<a href="tel:'+esc(phone)+'">'+esc(phone)+'</a>':'<span class="sub-sub">—</span>')+'</td>'+
      '<td class="tcell hide-sm">'+(email?'<a href="mailto:'+esc(email)+'">'+esc(email)+'</a>':'<span class="sub-sub">—</span>')+'</td>'+
      '<td class="tcell hide-sm">'+(trade?'<span class="trade-tag">'+esc(trade)+'</span>':'<span class="sub-sub">—</span>')+'</td>'+
      '<td class="tcell hide-sm">'+(mkt||'<span class="sub-sub">—</span>')+'</td>'+
      '<td class="tcell"><span class="badge '+(active?'active':'inactive')+'">'+(active?'Active':'Inactive')+'</span></td>'+
      '<td class="tcell"><div class="rowact">'+
        '<button class="btn ghost sm" onclick="openEdit(\''+s.id+'\')">Edit</button>'+
        '<button class="btn sm '+(active?'ghost':'acc')+'" onclick="toggleActive(\''+s.id+'\')">'+(active?'Deactivate':'Activate')+'</button>'+
      '</div></td>'+
    '</tr>';
  }).join('');
  document.getElementById('tblWrap').innerHTML=
    '<table><thead><tr>'+
    '<th>Company</th><th>Contact</th><th class="hide-sm">Phone</th><th class="hide-sm">Email</th>'+
    '<th class="hide-sm">Trade</th><th class="hide-sm">Market</th><th>Status</th><th></th>'+
    '</tr></thead><tbody>'+body+'</tbody></table>';
}

function openAdd(){
  EDIT_ID=null;
  document.getElementById('editTitle').textContent='Add Subcontractor';
  document.getElementById('fCompany').value='';
  document.getElementById('fContact').value='';
  document.getElementById('fPhone').value='';
  document.getElementById('fEmail').value='';
  document.getElementById('fTrade').value='';
  document.getElementById('fMarket').value='';
  document.getElementById('fNotes').value='';
  document.getElementById('fActive').checked=true;
  document.getElementById('delBtn').style.display='none';
  document.getElementById('editModal').classList.add('on');
  document.getElementById('fCompany').focus();
}

function openEdit(id){
  const s=SUBS.find(x=>String(x.id)===String(id));
  if(!s)return;
  EDIT_ID=s.id;
  document.getElementById('editTitle').textContent='Edit Subcontractor';
  document.getElementById('fCompany').value=s.company_name||'';
  document.getElementById('fContact').value=s.primary_contact||'';
  document.getElementById('fPhone').value=s.phone||'';
  document.getElementById('fEmail').value=s.email||'';
  document.getElementById('fTrade').value=s.primary_trade||'';
  document.getElementById('fMarket').value=(s.market||'').toLowerCase();
  document.getElementById('fNotes').value=s.notes||'';
  document.getElementById('fActive').checked=s.active!==false;
  // Delete is destructive + irreversible → Admin only.
  document.getElementById('delBtn').style.display=IS_ADMIN?'inline-block':'none';
  document.getElementById('editModal').classList.add('on');
}

// Defensive save: try the full payload, and if the schema is missing an
// optional column (primary_trade / market / notes), fall back to the core
// columns that every rebuild_subs row is known to have.
async function saveSub(){
  const company=document.getElementById('fCompany').value.trim();
  if(!company){toast('Company name is required.');document.getElementById('fCompany').focus();return;}
  const core={
    company_name:company,
    primary_contact:document.getElementById('fContact').value.trim()||null,
    phone:document.getElementById('fPhone').value.trim()||null,
    email:document.getElementById('fEmail').value.trim()||null,
    active:document.getElementById('fActive').checked
  };
  const full=Object.assign({},core,{
    primary_trade:document.getElementById('fTrade').value.trim()||null,
    market:document.getElementById('fMarket').value||null,
    notes:document.getElementById('fNotes').value.trim()||null
  });
  const btn=document.getElementById('saveBtn');
  btn.disabled=true;btn.textContent='Saving…';
  const done=(msg)=>{btn.disabled=false;btn.textContent='Save';toast(msg);};

  async function attempt(payload){
    if(EDIT_ID){
      return await sb.from('rebuild_subs').update(payload).eq('id',EDIT_ID);
    }
    return await sb.from('rebuild_subs').insert(payload);
  }

  let {error}=await attempt(full);
  let fellBack=false;
  // PostgREST reports an unknown column with code PGRST204 / a "column ... does
  // not exist" message. On that class of error, retry with core columns only.
  if(error&&(/column/i.test(error.message||'')||error.code==='PGRST204'||error.code==='42703')){
    const r2=await attempt(core);
    error=r2.error;
    fellBack=!error;
  }
  if(error){done('Save failed: '+error.message);return;}
  done(fellBack?'Saved (basic fields — trade/market/notes not in schema)':(EDIT_ID?'Sub updated':'Sub added'));
  closeModal('editModal');
  await loadSubs();
  render();
}

async function toggleActive(id){
  const s=SUBS.find(x=>String(x.id)===String(id));
  if(!s)return;
  const next=!(s.active!==false);
  const {error}=await sb.from('rebuild_subs').update({active:next}).eq('id',id);
  if(error){toast('Update failed: '+error.message);return;}
  s.active=next;
  render();
  toast(next?'Activated':'Deactivated');
}

async function delSub(){
  if(!EDIT_ID)return;
  if(!IS_ADMIN){toast('Only admins can delete.');return;}
  const s=SUBS.find(x=>String(x.id)===String(EDIT_ID));
  const nm=s?(s.company_name||'this sub'):'this sub';
  if(!confirm('Delete "'+nm+'" from the directory? This cannot be undone.\n\nIf they may return, use Deactivate instead.'))return;
  const {error}=await sb.from('rebuild_subs').delete().eq('id',EDIT_ID);
  if(error){toast('Delete failed: '+error.message);return;}
  closeModal('editModal');
  await loadSubs();
  render();
  toast('Deleted');
}

// wiring
document.getElementById('addBtn').onclick=openAdd;
document.getElementById('search').addEventListener('input',render);
document.getElementById('activeFilter').addEventListener('change',render);
document.getElementById('gateBtn').onclick=()=>tryEnter(document.getElementById('emailInput').value);
document.getElementById('emailInput').addEventListener('keydown',e=>{if(e.key==='Enter')tryEnter(document.getElementById('emailInput').value);});
document.getElementById('editModal').addEventListener('click',e=>{if(e.target.id==='editModal')closeModal('editModal');});
(function(){const e=detectEmail();if(e)tryEnter(e);else openGate('');})();
</script>
