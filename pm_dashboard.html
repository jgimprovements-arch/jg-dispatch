<style>
:root{
  --navy:#0d2d5e;--navy-deep:#08203f;--orange:#e85d04;--gold:#f5a623;
  --bg:#f7f9fc;--card:#ffffff;--border:#e1e5ec;--muted:#6b82a0;--text:#1a2942;
  --green:#22a66c;--red:#c62828;--yellow:#ff9800;
  --s3:#eef2f7;
}
*{box-sizing:border-box;}
body{margin:0;font-family:'DM Sans',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);font-size:14px;}
.mono{font-family:'DM Mono',monospace;}

/* LOGIN */
#login-screen{position:fixed;inset:0;background:linear-gradient(135deg,var(--navy) 0%,var(--navy-deep) 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:1000;color:#fff;padding:20px;}
#login-screen.hide{display:none;}
#login-screen img{width:140px;height:140px;object-fit:contain;border-radius:24px;margin-bottom:18px;filter:drop-shadow(0 4px 20px rgba(0,0,0,.3));}
.login-title{font-size:28px;font-weight:700;margin-bottom:8px;}
.login-sub{font-size:13px;color:rgba(255,255,255,.65);margin-bottom:28px;}
.login-err{font-size:12px;color:#ff8a8a;margin-top:12px;min-height:18px;text-align:center;max-width:320px;}

/* HEADER */
.hdr{background:var(--navy);color:#fff;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 12px rgba(0,0,0,.08);position:sticky;top:0;z-index:95;}
.hdr-left{display:flex;align-items:center;gap:14px;}
.hdr-logo{height:44px;width:auto;border-radius:6px;background:#fff;padding:4px 8px;object-fit:contain;display:block;}
.hdr-title{font-size:17px;font-weight:700;letter-spacing:.01em;}
.hdr-right{display:flex;align-items:center;gap:14px;font-size:12px;color:rgba(255,255,255,.85);flex-wrap:wrap;}
.btn-back,.btn-ghost{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#fff;padding:7px 14px;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;text-decoration:none;font-family:inherit;}
.btn-back:hover,.btn-ghost:hover{background:rgba(255,255,255,.18);}

/* MAIN */
.wrap{max-width:1200px;margin:0 auto;padding:24px;}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:18px;}
.section-title{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:10px;}
.toolbar{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;}
.seg{display:inline-flex;background:var(--bg);border:1px solid var(--border);border-radius:9px;padding:3px;gap:2px;flex-wrap:wrap;}
.seg button{border:0;background:transparent;font-family:'DM Sans',sans-serif;font-size:12px;font-weight:600;color:var(--muted);padding:7px 14px;border-radius:7px;cursor:pointer;white-space:nowrap;}
.seg button.on{background:var(--navy);color:#fff;}
.tabbar{display:inline-flex;gap:4px;margin-bottom:16px;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:4px;}
.tabbar button{border:0;background:transparent;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:700;color:var(--muted);padding:9px 18px;border-radius:7px;cursor:pointer;}
.tabbar button.on{background:var(--navy);color:#fff;}
.win-label{font-size:12px;color:var(--muted);font-family:'DM Mono',monospace;}

/* KPIs */
.kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:18px;}
.kpi{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px;position:relative;overflow:hidden;}
.kpi-accent{position:absolute;top:0;left:0;width:100%;height:3px;background:var(--orange);}
.kpi-label{font-size:10px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-family:'DM Mono',monospace;margin-bottom:6px;}
.kpi-value{font-size:28px;font-weight:700;font-family:'DM Mono',monospace;color:var(--navy);line-height:1.1;}
.kpi-sub{font-size:11px;color:var(--muted);margin-top:4px;}
.loc-cards{display:flex;gap:12px;flex-wrap:wrap;}
.loc-tile{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:10px 16px;min-width:150px;}
.loc-tile .ln{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;}
.loc-tile .lv{font-size:19px;font-weight:700;font-family:'DM Mono',monospace;color:var(--navy);margin-top:3px;}

/* TABLE */
table{width:100%;border-collapse:collapse;font-size:13px;}
thead th{text-align:right;padding:10px 12px;font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-family:'DM Mono',monospace;border-bottom:1.5px solid var(--border);white-space:nowrap;cursor:pointer;user-select:none;}
thead th:first-child{text-align:left;}
thead th:hover{color:var(--navy);}
thead th .arr{color:var(--orange);font-size:9px;}
tbody td{padding:11px 12px;border-bottom:1px solid var(--border);vertical-align:middle;text-align:right;font-variant-numeric:tabular-nums;}
tbody td:first-child{text-align:left;}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover{background:rgba(13,45,94,.02);}
tbody tr.me-row{background:rgba(232,93,4,.07);box-shadow:inset 3px 0 0 var(--orange);}
tbody tr.me-row:hover{background:rgba(232,93,4,.1);}
.you-badge{font-family:'DM Mono',monospace;font-size:9px;font-weight:700;color:#fff;background:var(--orange);border-radius:4px;padding:1px 6px;margin-left:6px;vertical-align:middle;text-transform:uppercase;letter-spacing:.04em;}
tbody tr.total-row{background:var(--s3);font-weight:700;}
tbody tr.total-row td{border-top:2px solid var(--border);}
.pm-name{font-weight:700;color:var(--navy);}
.num{font-family:'DM Mono',monospace;}
.good{color:var(--green);font-weight:700;}
.warn{color:var(--yellow);font-weight:700;}
.bad{color:var(--red);font-weight:700;}
.flag{font-size:9px;color:var(--yellow);background:rgba(255,152,0,.12);border-radius:4px;padding:1px 5px;margin-left:5px;font-weight:700;white-space:nowrap;}
.pills{display:inline-flex;gap:4px;justify-content:flex-end;flex-wrap:wrap;}
.pill{font-family:'DM Mono',monospace;font-size:10px;font-weight:500;padding:2px 7px;border-radius:20px;white-space:nowrap;}
.pill.lead{background:rgba(13,45,94,.07);color:var(--navy);}
.pill.prod{background:rgba(34,166,108,.12);color:var(--green);}
.pill.lost{background:rgba(198,40,40,.1);color:var(--red);}
.pill.hold{background:rgba(255,152,0,.14);color:#b36b00;}
.pill.other{background:#e8edf3;color:#7a879b;}
.empty{color:var(--muted);text-align:center;padding:50px 0;font-size:14px;}
.foot{font-size:11px;color:var(--muted);line-height:1.7;}
.foot b{color:var(--text);}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:6px;}
.legend span{display:inline-flex;align-items:center;gap:5px;}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;}
.note{background:rgba(13,45,94,.04);border-left:3px solid var(--navy);border-radius:6px;padding:10px 14px;font-size:12px;color:var(--text);margin-bottom:16px;line-height:1.5;}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:11px 20px;border-radius:10px;font-size:13px;font-weight:600;z-index:800;opacity:0;transition:opacity .2s;pointer-events:none;}
.toast.on{opacity:1;}
@media(max-width:720px){.hide-sm{display:none;}.wrap{padding:16px;}}
</style>
</head>

  <div class="login-title">PM Performance</div>

  <div class="g_id_signin" data-type="standard" data-size="large" data-theme="filled_black" data-text="sign_in_with" data-shape="rectangular" data-logo_alignment="left" data-width="288"></div>

<!-- HEADER -->
<div class="hdr" id="app-header" style="display:none;">
  <div class="hdr-left">
    <img src="https://jgimprovements-arch.github.io/jg-dispatch/logo.png" alt="JG" class="hdr-logo" onerror="this.style.display='none'">

<!-- MAIN -->
<div class="wrap" id="app-main" style="display:none;">

</div>

<script>
const SB_URL='https://nuykvchgecpiuikoerze.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im51eWt2Y2hnZWNwaXVpa29lcnplIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYyNjM3ODYsImV4cCI6MjA5MTgzOTc4Nn0.39hZ8DdjT_0iFJXPeAL2FXUSLw8FZBirDVzxZTO1W9s';
// Leaderboard — admin, office, and PMs can all view.
const ACCESS_ROLES=['admin','office','project manager'];
const ADMIN_EMAILS=['josh@jg-restoration.com','josh.greil@jg-restoration.com','lisa@jg-restoration.com','jgimprovements@gmail.com'];
let sb=null,ME=null,PMS=[],WIN='ytd',SORT={key:'revenue',dir:-1},TAB='recon';
// Both tabs pull LIVE from Albi (the database only holds a recent partial sync;
// the full history lives in Albi). Same proxy the dispatch board uses. One pull
// of the last ~12 months serves both tabs — each filters to its own types.
const PROXY_URL='https://jg-albi-proxy.josh-70f.workers.dev';
const RECON_TYPES=new Set(['Reconstruction','Board Up','Roofing/Exterior','Raze','Remediation']);
const MIT_TYPES=new Set(['Water Mitigation','Fire Mitigation','Mold','CAT3','Contents','General Clean','Biohazard']);
let ALBI=null,ALBI_LOADING=false,ALBI_ERR=null;
// PM rosters — who runs reconstruction vs mitigation. Matched by first+last name
// (middle initials ignored). Easy to edit here; can move to an employee field later.
function nkey(n){const t=String(n||'').trim().toLowerCase().split(/\s+/).filter(Boolean);return t.length>=2?(t[0]+' '+t[t.length-1]):(t[0]||'');}
const RECON_PM_KEYS=new Set(['paul dischler','chad pansier','richard yahr']);
const MIT_PM_KEYS=new Set(['rylan reoh','brent thalacker','brandon olmsted']);

function goHome(){window.location='hub.html';}
function _hasAccessRole(roleStr){
  return String(roleStr||'').split(',').map(r=>r.trim().toLowerCase()).filter(Boolean).some(r=>ACCESS_ROLES.indexOf(r)!==-1);
}
async function _emailAllowed(email){
  if(ADMIN_EMAILS.indexOf(email)!==-1) return true;
  try{
    const c=window.supabase.createClient(SB_URL,SB_KEY);
    const {data}=await c.from('employees').select('role,active').or('email.eq.'+email+',personal_email.eq.'+email).limit(1);
    const emp=data&&data[0];
    if(emp&&emp.active!==false&&_hasAccessRole(emp.role)) return true;
  }catch(err){}
  return false;
}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),2600);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function detectEmail(){try{const r=localStorage.getItem('jg_platform_user')||localStorage.getItem('jg_tc_user');if(r){const u=JSON.parse(r);return u&&u.email?String(u.email).toLowerCase():null;}}catch(e){}return null;}

// Google sign-in callback — decode the credential, then run the role gate.
function onGoogleSignIn(resp){
  try{
    const payload=JSON.parse(atob(resp.credential.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')));
    const email=String(payload.email||'').toLowerCase();
    try{localStorage.setItem('jg_platform_user',JSON.stringify({email:email,name:payload.name||''}));}catch(e){}
    tryEnter(email);
  }catch(e){document.getElementById('login-err').textContent='Sign-in failed — please try again.';}
}
async function tryEnter(email){
  email=String(email||'').trim().toLowerCase();
  if(!email)return;
  const ok=await _emailAllowed(email);
  if(!ok){document.getElementById('login-err').textContent='This view is limited to PM, office, and admin accounts.';return;}
  ME=email;
  document.getElementById('login-screen').classList.add('hide');
  document.getElementById('app-header').style.display='flex';
  document.getElementById('app-main').style.display='block';
  document.getElementById('user-label').textContent=email;
  await boot();
}

async function boot(){
  if(!window.supabase||!window.supabase.createClient){toast('Database library blocked - check tracking prevention');return;}
  sb=window.supabase.createClient(SB_URL,SB_KEY);
  document.getElementById('tblWrap').innerHTML='<div class="empty">Loading…</div>';
  await Promise.all([loadPMs(),loadProjects()]);
  render();
}

async function loadPMs(){
  const {data,error}=await sb.from('employees').select('name,email,role,active');
  if(error){toast('Employee load failed: '+error.message);PMS=[];return;}
  PMS=(data||[]).filter(e=>e&&e.active!==false&&String(e.role||'').split(',').map(r=>r.trim().toLowerCase()).includes('project manager'))
    .map(e=>({name:String(e.name||'').trim(),email:String(e.email||'').trim().toLowerCase()}));
}
async function loadProjects(){
  PROJECTS=[];
  const cols='albi_pm_name,albi_pm_email,pm_email,status,albi_status_normalized,actual_revenue,estimated_revenue,gross_profit,paid_amount,billed_pct,created_at,market';
  let from=0;const page=1000;
  while(true){
    const {data,error}=await sb.from('rebuild_projects').select(cols).order('created_at',{ascending:false}).range(from,from+page-1);
    if(error){toast('Project load failed: '+error.message);break;}
    const batch=data||[];
    PROJECTS.push(...batch);
    if(batch.length<page)break;
    from+=page; if(from>50000)break;
  }
}

function winStart(){
  const now=new Date();
  if(WIN==='mtd')return new Date(now.getFullYear(),now.getMonth(),1);
  if(WIN==='ytd')return new Date(now.getFullYear(),0,1);
  if(WIN==='t12'){const d=new Date(now);d.setFullYear(d.getFullYear()-1);return d;}
  return null;
}
function winText(){
  const s=winStart();
  if(!s)return 'All time';
  const f=d=>d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
  return f(s)+' → today';
}
// "Reached production" = In Production + Closed (and anything past). Edit keywords if a status buckets wrong.
function statusBucket(raw){
  const s=String(raw||'').toLowerCase();
  if(!s)return 'other';
  if(/lost|dead|cancel|declin|void|no\s*sale/.test(s))return 'lost';
  if(/hold|pause|wait/.test(s))return 'hold';
  if(/production|active|progress|rebuild|mitigat|closed|complet|invoic|collect|paid|won|job/.test(s))return 'prod';
  if(/new|lead|estimat|inspect|bid|pending|schedul|opportunit|quote/.test(s))return 'lead';
  return 'other';
}

function computeRows(){
  const start=winStart();
  const pms=PMS.filter(p=>RECON_PM_KEYS.has(nkey(p.name)));
  const emailToPM={},nameToPM={};
  pms.forEach(p=>{ if(p.email)emailToPM[p.email]=p; if(p.name)nameToPM[p.name.toLowerCase()]=p; });
  const agg={};
  pms.forEach(p=>{ agg[p.email]={pm:p,jobs:0,prod:0,lead:0,lost:0,hold:0,other:0,revenue:0,gp:0,paid:0,revWithCogs:0,noCogs:0}; });
  const byLoc={Appleton:0,'Stevens Point':0,Other:0};
  let excluded=0,inWindow=0;
  PROJECTS.forEach(pr=>{
    if(start){ const c=pr.created_at?new Date(pr.created_at):null; if(!c||c<start)return; }
    inWindow++;
    const m=String(pr.market||'').toLowerCase();
    byLoc[m.includes('appleton')?'Appleton':(m.includes('stevens')||m.includes('point'))?'Stevens Point':'Other']+=Number(pr.actual_revenue)||0;
    const em1=String(pr.pm_email||'').trim().toLowerCase();
    const em2=String(pr.albi_pm_email||'').trim().toLowerCase();
    const nm=String(pr.albi_pm_name||'').trim().toLowerCase();
    const pm=emailToPM[em1]||emailToPM[em2]||nameToPM[nm];
    if(!pm){excluded++;return;}
    const a=agg[pm.email];
    const b=statusBucket(pr.albi_status_normalized||pr.status);
    a.jobs++; a[b==='prod'?'prod':b==='lead'?'lead':b==='lost'?'lost':b==='hold'?'hold':'other']++;
    const rev=Number(pr.actual_revenue)||0,gp=Number(pr.gross_profit)||0,paid=Number(pr.paid_amount)||0;
    a.revenue+=rev; a.paid+=paid;
    if(rev>0){ a.gp+=gp; a.revWithCogs+=rev; if(!pr.gross_profit&&pr.gross_profit!==0)a.noCogs++; }
  });
  const rows=Object.values(agg).map(a=>({
    name:a.pm.name,email:a.pm.email,jobs:a.jobs,prod:a.prod,lead:a.lead,lost:a.lost,hold:a.hold,other:a.other,
    closing:a.jobs>0?(a.prod/a.jobs*100):0,
    revenue:a.revenue,
    margin:a.revWithCogs>0?(a.gp/a.revWithCogs*100):null,
    avgJob:a.prod>0?(a.revenue/a.prod):0,
    billed:a.revenue>0?(a.paid/a.revenue*100):null,
    noCogs:a.noCogs
  }));
  return {rows,excluded,inWindow,byLoc};
}
function renderLoc(byLoc,label){
  document.getElementById('locTitle').textContent='Revenue by Location · '+label;
  const order=['Appleton','Stevens Point','Other'];
  document.getElementById('locCards').innerHTML=order
    .filter(k=>k!=='Other'||(byLoc[k]||0)>0)
    .map(k=>'<div class="loc-tile"><div class="ln">'+k+'</div><div class="lv">'+moneyFull(byLoc[k]||0)+'</div></div>').join('');
}

function money(n){n=Number(n)||0;const a=Math.abs(n);if(a>=1e6)return '$'+(n/1e6).toFixed(1)+'M';if(a>=1e3)return '$'+Math.round(n/1e3)+'k';return '$'+Math.round(n).toLocaleString();}
function moneyFull(n){return '$'+Math.round(Number(n)||0).toLocaleString();}
function pct(n){return n==null?'—':(Math.round(n)+'%');}
function closingClass(v){return v>=70?'good':v>=40?'warn':'bad';}

function render(){
  document.getElementById('winLabel').textContent=winText();
  if(TAB==='mit'){renderMit();return;}
  renderRecon();
}

function renderRecon(){
  document.getElementById('tblTitle').textContent='Leaderboard · Reconstruction Jobs';
  document.getElementById('locCard').style.display='block';
  const {rows,excluded,inWindow,byLoc}=computeRows();
  renderLoc(byLoc,'Reconstruction');

  const totJobs=rows.reduce((s,r)=>s+r.jobs,0);
  const totProd=rows.reduce((s,r)=>s+r.prod,0);
  const totRev=rows.reduce((s,r)=>s+r.revenue,0);
  const totGp=rows.reduce((s,r)=>s+(r.margin!=null?r.revenue*r.margin/100:0),0);
  const coMargin=totRev>0?(totGp/totRev*100):null;
  const coClosing=totJobs>0?(totProd/totJobs*100):0;
  document.getElementById('kpiRow').innerHTML=
    kpi(money(totRev),'Total Revenue','actual, across listed PMs')+
    kpi(pct(coMargin),'Gross Margin','revenue-weighted')+
    kpi(pct(coClosing),'Closing Rate','reached production ÷ assigned')+
    kpi(totJobs,'Jobs',totProd+' reached production');

  if(!rows.length){
    document.getElementById('tblWrap').innerHTML='<div class="empty">No project-manager employees found. Set an employee\'s role to include "Project Manager" in Time Admin.</div>';
    document.getElementById('foot').innerHTML='';
    return;
  }

  rows.sort((a,b)=>{
    let x=a[SORT.key],y=b[SORT.key];
    if(SORT.key==='name'){x=String(x).toLowerCase();y=String(y).toLowerCase();return x<y?-SORT.dir:x>y?SORT.dir:0;}
    x=x==null?-1:x;y=y==null?-1:y;return (x-y)*SORT.dir;
  });

  const arr=k=>SORT.key===k?('<span class="arr">'+(SORT.dir<0?'▼':'▲')+'</span>'):'';
  const head='<tr>'+
    '<th data-k="name">PM '+arr('name')+'</th>'+
    '<th data-k="jobs">Jobs '+arr('jobs')+'</th>'+
    '<th data-k="closing">Closing '+arr('closing')+'</th>'+
    '<th data-k="revenue">Revenue '+arr('revenue')+'</th>'+
    '<th data-k="margin">Margin '+arr('margin')+'</th>'+
    '<th data-k="avgJob" class="hide-sm">Avg Job '+arr('avgJob')+'</th>'+
    '<th data-k="billed" class="hide-sm">Billed '+arr('billed')+'</th>'+
    '<th class="hide-sm">Status</th>'+
  '</tr>';

  const body=rows.map(r=>{
    const pills='<div class="pills">'+
      (r.lead?'<span class="pill lead" title="Leads / New">'+r.lead+' lead</span>':'')+
      (r.prod?'<span class="pill prod" title="In production + closed">'+r.prod+' prod</span>':'')+
      (r.hold?'<span class="pill hold" title="On hold">'+r.hold+' hold</span>':'')+
      (r.lost?'<span class="pill lost" title="Lost / dead">'+r.lost+' lost</span>':'')+
      (r.other?'<span class="pill other" title="Unmapped status">'+r.other+' ?</span>':'')+
    '</div>';
    const marginFlag=r.noCogs>0?'<span class="flag" title="'+r.noCogs+' job(s) have revenue but no cost recorded — margin may read high">⚠ '+r.noCogs+'</span>':'';
    const isMe=r.email&&r.email===ME;
    return '<tr'+(isMe?' class="me-row"':'')+'>'+
      '<td class="pm-name">'+esc(r.name)+(isMe?' <span class="you-badge">You</span>':'')+'</td>'+
      '<td class="num">'+r.jobs+'</td>'+
      '<td class="num '+closingClass(r.closing)+'">'+pct(r.closing)+'</td>'+
      '<td class="num">'+moneyFull(r.revenue)+'</td>'+
      '<td class="num">'+pct(r.margin)+marginFlag+'</td>'+
      '<td class="num hide-sm">'+(r.avgJob?money(r.avgJob):'—')+'</td>'+
      '<td class="num hide-sm">'+pct(r.billed)+'</td>'+
      '<td class="hide-sm">'+pills+'</td>'+
    '</tr>';
  }).join('');

  const totalRow='<tr class="total-row">'+
    '<td>Company ('+rows.length+' PMs)</td>'+
    '<td class="num">'+totJobs+'</td>'+
    '<td class="num '+closingClass(coClosing)+'">'+pct(coClosing)+'</td>'+
    '<td class="num">'+moneyFull(totRev)+'</td>'+
    '<td class="num">'+pct(coMargin)+'</td>'+
    '<td class="num hide-sm">'+(totProd?money(totRev/totProd):'—')+'</td>'+
    '<td class="num hide-sm">—</td>'+
    '<td class="hide-sm"></td>'+
  '</tr>';

  document.getElementById('tblWrap').innerHTML='<table><thead>'+head+'</thead><tbody>'+body+totalRow+'</tbody></table>';
  document.querySelectorAll('thead th[data-k]').forEach(th=>{
    th.onclick=()=>{const k=th.dataset.k;if(SORT.key===k)SORT.dir*=-1;else{SORT.key=k;SORT.dir=(k==='name')?1:-1;}render();};
  });

  document.getElementById('foot').innerHTML=
    '<div class="note">This board covers <b>reconstruction jobs only</b> (the rebuild pipeline). Mitigation jobs are a separate Albi project type and aren\'t included yet — ask to add a mitigation view.</div>'+
    '<div><b>Closing rate</b> = jobs that reached production (In Production + Closed) ÷ all jobs assigned, within the window. '+
    '<b>Margin</b> is revenue-weighted (total gross profit ÷ total revenue). '+
    '<b>Avg Job</b> is revenue ÷ jobs that reached production. Window is by job <b>created date</b>.</div>'+
    '<div class="legend">'+
      '<span><span class="dot" style="background:var(--navy);opacity:.4;"></span>lead / new</span>'+
      '<span><span class="dot" style="background:var(--green);"></span>in production + closed</span>'+
      '<span><span class="dot" style="background:var(--yellow);"></span>on hold</span>'+
      '<span><span class="dot" style="background:var(--red);"></span>lost / dead</span>'+
      '<span><span class="dot" style="background:#aab4c4;"></span>unmapped (?)</span>'+
    '</div>'+
    (excluded>0?'<div style="margin-top:6px;">'+excluded+' of '+inWindow+' projects in this window are assigned to a PM not in the employee list (or unassigned) and are excluded. '+(rows.some(r=>r.other>0)?'Any "?" counts are status words I didn\'t recognize — tell me the exact label and I\'ll bucket it.':'')+'</div>':'')+
    (rows.some(r=>r.noCogs>0)?'<div style="margin-top:6px;color:#b36b00;">⚠ Margin flags mark PMs with jobs that have revenue but no cost recorded — those margins read high until COGS is entered.</div>':'');
}
function kpi(v,l,s){return '<div class="kpi"><div class="kpi-accent"></div><div class="kpi-label">'+l+'</div><div class="kpi-value">'+v+'</div>'+(s?'<div class="kpi-sub">'+s+'</div>':'')+'</div>';}

// ── MITIGATION (live Albi pull) ─────────────────────────────────────────────
function mitProgress(msg){const w=document.getElementById('tblWrap');if(w)w.innerHTML='<div class="empty">'+esc(msg)+'</div>';}
async function fetchT(url,ms){
  const ctl=('AbortController'in window)?new AbortController():null;
  const t=ctl?setTimeout(()=>ctl.abort(),ms):null;
  try{return await fetch(url,ctl?{signal:ctl.signal}:{});}finally{if(t)clearTimeout(t);}
}
async function loadMitProjects(){
  if(MIT_PROJECTS)return;
  MIT_LOADING=true; MIT_ERR=null; render();
  // Bound to the last 12 months. Assuming Albi returns newest-first, stop early
  // once we hit pages with nothing inside the window (2-page grace for safety).
  const cutoff=new Date(); cutoff.setFullYear(cutoff.getFullYear()-1);
  const all=[];let page=1,oldStreak=0;
  try{
    while(page<=40){
      mitProgress('Scanning Albi (last 12 mo)… page '+page+' · '+all.length+' mitigation jobs found');
      let r=await fetchT(PROXY_URL+'?pageSize=50&page='+page,15000);
      if(!r||!r.ok){MIT_ERR='Albi proxy returned HTTP '+(r?r.status:'(no response)')+' on page '+page;break;}
      let data=await r.json();
      const items=Array.isArray(data)?data:(data.data||data.results||data.projects||data.items||[]);
      if(!items.length)break;
      let anyRecent=false;
      items.forEach(p=>{
        const created=p.createdAt||p.createdDate||p.created_at||'';
        const c=created?new Date(created):null;
        if(c&&c>=cutoff)anyRecent=true;
        if(!c||c>=cutoff){const pt=p.projectType||p.project_type||p.type||'';if(MIT_TYPES.has(pt))all.push(p);}
      });
      if(items.length<50)break;
      if(anyRecent)oldStreak=0;else{oldStreak++;if(oldStreak>=2)break;}
      page++;
    }
  }catch(e){MIT_ERR=(e&&e.name==='AbortError')?'Albi request timed out (page '+page+').':('Could not reach Albi: '+(e&&e.message||e));}
  MIT_PROJECTS=all; MIT_LOADING=false;
}
function computeMitRows(){
  const start=winStart();
  const pms=PMS.filter(p=>MIT_PM_KEYS.has(nkey(p.name)));
  const emailToPM={},nameToPM={};
  pms.forEach(p=>{if(p.email)emailToPM[p.email]=p;if(p.name)nameToPM[p.name.toLowerCase()]=p;});
  const agg={};pms.forEach(p=>{agg[p.email]={pm:p,jobs:0,active:0,closed:0,revenue:0,gp:0,revWithCogs:0,noCogs:0,cycleSum:0,cycleN:0};});
  const byLoc={Appleton:0,'Stevens Point':0,Other:0};
  let excluded=0,inWindow=0;
  (MIT_PROJECTS||[]).forEach(p=>{
    const created=p.createdAt||p.createdDate||p.created_at||'';
    if(start){const c=created?new Date(created):null;if(!c||c<start)return;}
    inWindow++;
    const loc=String(p.location||p.locationName||'').toLowerCase();
    byLoc[loc.includes('appleton')?'Appleton':(loc.includes('stevens')||loc.includes('point'))?'Stevens Point':'Other']+=Number(p.actualRevenue)||0;
    const em=String(p.projectManagerEmail||'').trim().toLowerCase();
    const nm=String(p.projectManager||'').trim().toLowerCase();
    const pm=emailToPM[em]||nameToPM[nm];
    if(!pm){excluded++;return;}
    const a=agg[pm.email];
    a.jobs++;
    const st=String(p.status||'').toLowerCase();
    if(/closed|complet|invoic|collect|paid/.test(st))a.closed++;else a.active++;
    const rev=Number(p.actualRevenue)||0,gp=Number(p.grossProfit)||0;
    a.revenue+=rev;
    if(rev>0){a.gp+=gp;a.revWithCogs+=rev;if(!p.grossProfit&&p.grossProfit!==0)a.noCogs++;}
    const s=p.actualStart||p.startDate,e=p.actualCompletion||p.completedDate;
    if(s&&e){const d=(new Date(e)-new Date(s))/86400000;if(d>=0&&d<3650){a.cycleSum+=d;a.cycleN++;}}
  });
  const rows=Object.values(agg).map(a=>({
    name:a.pm.name,email:a.pm.email,jobs:a.jobs,active:a.active,closed:a.closed,
    revenue:a.revenue,margin:a.revWithCogs>0?(a.gp/a.revWithCogs*100):null,
    avgJob:a.jobs>0?(a.revenue/a.jobs):0,cycle:a.cycleN>0?(a.cycleSum/a.cycleN):null,noCogs:a.noCogs
  }));
  return {rows,excluded,inWindow,byLoc};
}
function renderMit(){
  document.getElementById('tblTitle').textContent='Leaderboard · Mitigation Jobs (live from Albi)';
  if(MIT_LOADING){
    document.getElementById('kpiRow').innerHTML='';
    document.getElementById('locCard').style.display='none';
    document.getElementById('tblWrap').innerHTML='<div class="empty">Loading mitigation jobs from Albi… (this can take a few seconds)</div>';
    document.getElementById('foot').innerHTML='';
    return;
  }
  const {rows,excluded,inWindow,byLoc}=computeMitRows();
  if(MIT_ERR){document.getElementById('locCard').style.display='none';}
  else{document.getElementById('locCard').style.display='block';renderLoc(byLoc,'Mitigation');}
  const totJobs=rows.reduce((s,r)=>s+r.jobs,0);
  const totRev=rows.reduce((s,r)=>s+r.revenue,0);
  const totGp=rows.reduce((s,r)=>s+(r.margin!=null?r.revenue*r.margin/100:0),0);
  const coMargin=totRev>0?(totGp/totRev*100):null;
  document.getElementById('kpiRow').innerHTML=
    kpi(money(totRev),'Mitigation Revenue','actual, across listed PMs')+
    kpi(pct(coMargin),'Gross Margin','revenue-weighted')+
    kpi(totJobs,'Mitigation Jobs','in window')+
    kpi(totJobs?money(totRev/totJobs):'—','Avg Job','revenue ÷ jobs');

  if(MIT_ERR){
    document.getElementById('tblWrap').innerHTML='<div class="empty" style="color:var(--red);">⚠ '+esc(MIT_ERR)+'</div>';
    document.getElementById('foot').innerHTML='<div class="note">The live Albi pull failed. Open your browser console (F12 → Console) and tell me the red error when you click this tab — that pins down whether it\'s a CORS/permission block or the proxy being unreachable.</div>';
    return;
  }
  if(!rows.length||!totJobs){
    document.getElementById('tblWrap').innerHTML='<div class="empty">'+(inWindow>0?('No mitigation jobs matched a listed PM in this window ('+inWindow+' mitigation jobs found, '+excluded+' assigned to a non-listed PM).'):'Albi returned projects, but none were mitigation types in this window. Try the "All Time" window.')+'</div>';
    document.getElementById('foot').innerHTML='<div class="note">Mitigation is pulled live from Albi. If this looks thin, the proxy may only be returning active jobs, or mitigation jobs may not carry revenue in Albi — tell me what you expected to see and I\'ll adjust.</div>';
    return;
  }

  rows.sort((a,b)=>{let x=a[SORT.key],y=b[SORT.key];if(SORT.key==='name'){x=String(x).toLowerCase();y=String(y).toLowerCase();return x<y?-SORT.dir:x>y?SORT.dir:0;}x=x==null?-1:x;y=y==null?-1:y;return (x-y)*SORT.dir;});
  const arr=k=>SORT.key===k?('<span class="arr">'+(SORT.dir<0?'▼':'▲')+'</span>'):'';
  const head='<tr>'+
    '<th data-k="name">PM '+arr('name')+'</th>'+
    '<th data-k="jobs">Jobs '+arr('jobs')+'</th>'+
    '<th data-k="active" class="hide-sm">Active '+arr('active')+'</th>'+
    '<th data-k="closed" class="hide-sm">Closed '+arr('closed')+'</th>'+
    '<th data-k="revenue">Revenue '+arr('revenue')+'</th>'+
    '<th data-k="margin">Margin '+arr('margin')+'</th>'+
    '<th data-k="avgJob" class="hide-sm">Avg Job '+arr('avgJob')+'</th>'+
    '<th data-k="cycle" class="hide-sm">Cycle '+arr('cycle')+'</th>'+
  '</tr>';
  const body=rows.map(r=>{
    const isMe=r.email&&r.email===ME;
    const marginFlag=r.noCogs>0?'<span class="flag" title="'+r.noCogs+' job(s) have revenue but no cost recorded">⚠ '+r.noCogs+'</span>':'';
    return '<tr'+(isMe?' class="me-row"':'')+'>'+
      '<td class="pm-name">'+esc(r.name)+(isMe?' <span class="you-badge">You</span>':'')+'</td>'+
      '<td class="num">'+r.jobs+'</td>'+
      '<td class="num hide-sm">'+r.active+'</td>'+
      '<td class="num hide-sm">'+r.closed+'</td>'+
      '<td class="num">'+moneyFull(r.revenue)+'</td>'+
      '<td class="num">'+pct(r.margin)+marginFlag+'</td>'+
      '<td class="num hide-sm">'+(r.avgJob?money(r.avgJob):'—')+'</td>'+
      '<td class="num hide-sm">'+(r.cycle!=null?Math.round(r.cycle)+'d':'—')+'</td>'+
    '</tr>';
  }).join('');
  const totalRow='<tr class="total-row">'+
    '<td>Company ('+rows.length+' PMs)</td>'+
    '<td class="num">'+totJobs+'</td>'+
    '<td class="num hide-sm">'+rows.reduce((s,r)=>s+r.active,0)+'</td>'+
    '<td class="num hide-sm">'+rows.reduce((s,r)=>s+r.closed,0)+'</td>'+
    '<td class="num">'+moneyFull(totRev)+'</td>'+
    '<td class="num">'+pct(coMargin)+'</td>'+
    '<td class="num hide-sm">'+(totJobs?money(totRev/totJobs):'—')+'</td>'+
    '<td class="num hide-sm">—</td>'+
  '</tr>';
  document.getElementById('tblWrap').innerHTML='<table><thead>'+head+'</thead><tbody>'+body+totalRow+'</tbody></table>';
  document.querySelectorAll('thead th[data-k]').forEach(th=>{th.onclick=()=>{const k=th.dataset.k;if(SORT.key===k)SORT.dir*=-1;else{SORT.key=k;SORT.dir=(k==='name')?1:-1;}render();};});
  document.getElementById('foot').innerHTML=
    '<div class="note">Mitigation jobs are pulled <b>live from Albi</b> (they aren\'t synced to the database), limited to the <b>last 12 months</b> for speed. Types: Water/Fire Mitigation, Mold, CAT3, Contents, General Clean, Biohazard. No closing rate — mitigation is dispatched, not sold.</div>'+
    '<div><b>Revenue</b> = actual revenue. <b>Margin</b> = revenue-weighted (gross profit ÷ revenue). <b>Cycle</b> = avg days from start to completion, where Albi has both dates.</div>'+
    (excluded>0?'<div style="margin-top:6px;">'+excluded+' of '+inWindow+' mitigation jobs in this window are assigned to a PM not in the employee list and are excluded.</div>':'')+
    (rows.some(r=>r.noCogs>0)?'<div style="margin-top:6px;color:#b36b00;">⚠ Margin flags mark PMs with jobs that have revenue but no cost recorded.</div>':'');
}

// wiring
document.getElementById('tabBar').addEventListener('click',async e=>{
  const b=e.target.closest('button[data-tab]');if(!b)return;
  TAB=b.dataset.tab;
  document.querySelectorAll('#tabBar button').forEach(x=>x.classList.toggle('on',x===b));
  if(TAB==='mit'&&!MIT_PROJECTS&&!MIT_LOADING){await loadMitProjects();}
  render();
});
document.getElementById('winSeg').addEventListener('click',e=>{
  const b=e.target.closest('button[data-win]');if(!b)return;
  WIN=b.dataset.win;
  document.querySelectorAll('#winSeg button').forEach(x=>x.classList.toggle('on',x===b));
  render();
});
