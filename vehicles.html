<style>
:root{
  --navy:#0d2d5e;--orange:#e85d04;--gold:#f5a623;
  --bg:#f0ede8;--s1:#faf9f7;--s2:#f0ede8;--s3:#e8e4df;
  --brd:rgba(13,45,94,.12);--brdH:rgba(13,45,94,.3);
  --surface:#faf9f7;--border:rgba(13,45,94,.12);--muted:#6b7a96;
  --acc:#e85d04;--txt:#0d1f3c;--dim:#6b7a96;--mut:#a0abbf;
  --red:#c02020;--redD:rgba(192,32,32,.08);
  --grn:#2e7d32;--grnD:rgba(46,125,50,.08);
  --wrn:#e65100;--wrnD:rgba(230,81,0,.08);--ok:#2e7d32;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font-family:'DM Sans',system-ui,sans-serif;min-height:100vh;}
.mono{font-family:'DM Mono',monospace}
.admin-hdr{background:var(--navy);padding:0 16px;height:50px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:95;}
.admin-hdr .back{color:rgba(255,255,255,.75);font-size:12px;text-decoration:none;font-weight:600;}
.admin-hdr .back:hover{color:#fff;}
.export-btn{padding:8px 16px;border-radius:6px;border:none;font-size:12px;font-weight:700;cursor:pointer;font-family:'DM Sans',sans-serif;background:var(--orange);color:#fff;}
.export-btn:hover{filter:brightness(.95);}
.sub-tab-bar{background:var(--s1);border-bottom:1px solid var(--brd);padding:0 16px;display:flex;position:sticky;top:50px;z-index:94;}
.sub-tab{padding:11px 18px;border:none;background:transparent;font-size:12px;font-weight:500;color:var(--dim);cursor:pointer;border-bottom:2px solid transparent;font-family:'DM Sans',sans-serif;}
.sub-tab.active{color:var(--orange);border-bottom-color:var(--orange);font-weight:700;}
.sub-tab:hover{color:var(--navy);}
.wrap{max-width:1160px;margin:0 auto;padding:18px 16px 90px;}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px;}
input,select,textarea{font-family:'DM Sans',sans-serif;font-size:13px;padding:9px 11px;border:1px solid var(--brd);border-radius:8px;background:#fff;color:var(--txt);width:100%;}
textarea{resize:vertical;min-height:60px;}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brdH);}
.btn{background:var(--navy);color:#fff;border:0;border-radius:8px;padding:9px 15px;font-size:13px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;white-space:nowrap;}
.btn:hover{background:#12386f;}
.btn.acc{background:var(--orange);}.btn.acc:hover{filter:brightness(.95);}
.btn.ghost{background:#fff;color:var(--navy);border:1px solid var(--brd);}
.btn.ghost:hover{border-color:var(--brdH);}
.btn.sm{padding:6px 11px;font-size:12px;}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px;}
.vcard{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px;position:relative;overflow:hidden;}
.vcard::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--accent,var(--muted));}
.vcard.s-active{--accent:var(--grn);}
.vcard.s-in_shop{--accent:var(--wrn);}
.vcard.s-flagged{--accent:var(--red);}
.vcard.s-retired{--accent:#aab4c4;opacity:.7;}
.vcard h3{font-size:16px;font-weight:700;color:var(--navy);display:flex;align-items:center;gap:8px;margin-bottom:2px;}
.vmeta{font-size:11px;color:var(--muted);margin-bottom:10px;}
.badge{font-family:'DM Mono',monospace;font-size:9px;font-weight:500;padding:2px 8px;border-radius:20px;text-transform:uppercase;letter-spacing:.05em;}
.badge.active{background:var(--grnD);color:var(--grn);}
.badge.in_shop{background:var(--wrnD);color:var(--wrn);}
.badge.flagged{background:var(--redD);color:var(--red);}
.badge.retired{background:#e8e4df;color:#7a879b;}
.kv{display:flex;justify-content:space-between;font-size:13px;padding:4px 0;border-bottom:1px solid var(--border);}
.kv:last-of-type{border-bottom:none;}
.kv b{font-weight:600;color:var(--navy);}
.due{margin-top:10px;padding-top:8px;border-top:1px solid var(--border);}
.due .drow{display:flex;justify-content:space-between;font-size:12px;padding:2px 0;}
.due .overdue{color:var(--red);font-weight:700;}
.due .soon{color:var(--wrn);font-weight:600;}
.issue-flag{background:var(--redD);border:1px solid rgba(192,32,32,.25);border-radius:8px;padding:7px 10px;font-size:12px;color:#912424;margin-top:10px;font-weight:500;}
.vactions{display:flex;gap:7px;margin-top:12px;flex-wrap:wrap;}
.empty{color:var(--muted);text-align:center;padding:50px 0;font-size:14px;}
.section-hdr{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:4px 0 14px;font-family:'DM Mono',monospace;display:flex;align-items:center;gap:8px;}
.section-hdr::after{content:'';flex:1;height:1px;background:var(--border);}
.issue-card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:12px 14px;margin-bottom:8px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;}
.hist-row{display:flex;justify-content:space-between;font-size:12px;padding:5px 0;border-bottom:1px solid var(--border);}
.modal-back{position:fixed;inset:0;background:rgba(13,29,60,.5);display:none;align-items:flex-start;justify-content:center;z-index:600;padding:24px 12px;overflow:auto;}
.modal-back.on{display:flex;}
.modal{background:#fff;border-radius:12px;width:100%;max-width:580px;padding:20px 22px;box-shadow:0 20px 60px rgba(13,29,60,.25);}
.modal h2{font-size:16px;color:var(--navy);margin-bottom:14px;}
.frow{margin-bottom:11px;}
.frow label{display:block;font-size:11px;font-weight:600;color:var(--dim);text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px;}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:11px;}
.f3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:11px;}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:11px 20px;border-radius:10px;font-size:13px;font-weight:600;z-index:800;opacity:0;transition:opacity .2s;pointer-events:none;}
.toast.on{opacity:1;}
.gate{background:#fff;border:1px solid var(--brd);border-radius:12px;padding:26px;text-align:center;max-width:420px;margin:70px auto;}
.gate h1{font-size:18px;color:var(--navy);margin-bottom:6px;}
@media(max-width:600px){.f2,.f3{grid-template-columns:1fr;}.vgrid{grid-template-columns:1fr;}}
</style>
</head>
<body>
<div id="app" style="display:none">
  <div class="admin-hdr">
    <div style="display:flex;align-items:center;gap:10px;">
      <span style="font-size:18px;">🚐</span>
      <span style="font-size:13px;font-weight:600;color:#fff;letter-spacing:-.3px;">JG Restoration <span style="color:var(--gold);">Fleet</span></span>
    </div>
    <a href="admin.html" class="back">← Admin Panel</a>
  </div>
  <div class="sub-tab-bar">
    <button class="sub-tab active" id="tabFleet">Fleet</button>
    <button class="sub-tab" id="tabIssues">Open Issues <span id="issueCount" class="mono"></span></button>
  </div>
  <div class="wrap">
    <div id="fleetTab">
      <div class="toolbar">
        <input id="search" placeholder="Search name, plate, number..." style="max-width:300px">
        <select id="marketFilter" style="max-width:170px">
          <option value="">All markets</option><option value="appleton">Appleton</option><option value="stevens_point">Stevens Point</option>
        </select>
        <select id="statusFilter" style="max-width:190px">
          <option value="active_set">Active + In Shop</option><option value="">All (incl. retired)</option><option value="active">Active only</option><option value="in_shop">In shop</option><option value="flagged">Flagged</option><option value="retired">Retired</option>
        </select>
        <button class="btn acc" id="addBtn">+ Add Vehicle</button>
      </div>
      <div class="vgrid" id="vgrid"></div>
    </div>
    <div id="issuesTab" style="display:none"></div>
  </div>
</div>
<div class="modal-back" id="vModal"><div class="modal">
  <h2 id="vModalTitle">Add Vehicle</h2>
  <input type="hidden" id="vId">
  <input type="hidden" id="fPhotoUrl">
  <div class="frow" style="display:flex;align-items:center;gap:14px;">
    <div id="photoPreview" style="width:84px;height:64px;border-radius:8px;background:#eef1f6 center/cover no-repeat;border:1px solid var(--brd);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:22px;color:#9aa7bd;">🚐</div>
    <div>
      <label>Vehicle photo</label>
      <input type="file" id="fPhotoFile" accept="image/*" style="font-size:12px;padding:6px;">
      <div id="photoStatus" style="font-size:11px;color:var(--muted);margin-top:3px;">For identification. JPG/PNG.</div>
    </div>
  </div>
  <div class="f2"><div class="frow"><label>Name *</label><input id="fName" placeholder="Van 3"></div><div class="frow"><label>Fleet #</label><input id="fNumber" placeholder="V-03"></div></div>
  <div class="f3"><div class="frow"><label>Year</label><input id="fYear" type="number"></div><div class="frow"><label>Make</label><input id="fMake"></div><div class="frow"><label>Model</label><input id="fModel"></div></div>
  <div class="f2"><div class="frow"><label>Plate</label><input id="fPlate"></div><div class="frow"><label>VIN</label><input id="fVin"></div></div>
  <div class="f2"><div class="frow"><label>Market</label><select id="fMarket"><option value="">-</option><option value="appleton">Appleton</option><option value="stevens_point">Stevens Point</option></select></div><div class="frow"><label>Usual driver (dedicated)</label><select id="fUsual"><option value="">- none / pool -</option></select></div></div>
  <div class="f2"><div class="frow"><label>Status</label><select id="fStatus"><option value="active">Active</option><option value="in_shop">In shop</option><option value="flagged">Flagged</option><option value="retired">Retired</option></select></div><div class="frow"><label>Current mileage</label><input id="fMileage" type="number"></div></div>
  <div class="f2"><div class="frow"><label>Oil interval (mi)</label><input id="fOilInterval" type="number" placeholder="5000"></div><div class="frow"><label>Last oil @ mileage</label><input id="fLastOil" type="number"></div></div>
  <div class="f3"><div class="frow"><label>Registration due</label><input id="fReg" type="date"></div><div class="frow"><label>Insurance due</label><input id="fIns" type="date"></div><div class="frow"><label>DOT inspection due</label><input id="fInsp" type="date"></div></div>
  <div class="frow"><label>Notes</label><textarea id="fNotes"></textarea></div>
  <div class="modal-actions"><button class="btn ghost" onclick="closeModal('vModal')">Cancel</button><button class="btn acc" id="saveVehicle">Save</button></div>
</div></div>
<div class="modal-back" id="sModal"><div class="modal">
  <h2 id="sModalTitle">Log Service</h2>
  <input type="hidden" id="sVehicleId">
  <div class="f2"><div class="frow"><label>Date *</label><input id="sDate" type="date"></div><div class="frow"><label>Type</label><select id="sType"><option>oil</option><option>tires</option><option>brakes</option><option>registration</option><option>insurance</option><option>inspection</option><option>repair</option><option>other</option></select></div></div>
  <div class="f2"><div class="frow"><label>Mileage at service</label><input id="sMileage" type="number"></div><div class="frow"><label>Cost ($)</label><input id="sCost" type="number" step="0.01"></div></div>
  <div class="frow"><label>Vendor</label><input id="sVendor"></div>
  <div class="frow"><label>Note</label><textarea id="sNote"></textarea></div>
  <div id="sHistory"></div>
  <div class="modal-actions"><button class="btn ghost" onclick="closeModal('sModal')">Close</button><button class="btn acc" id="saveService">Save Service</button></div>
</div></div>
<div class="gate" id="gate">
  <h1>🚐 Fleet</h1>
  <p style="color:var(--muted);font-size:13px;margin-bottom:8px;">Sign in with your JG admin account.</p>
  <p id="gateMsg" style="color:var(--red);font-size:13px;"></p>
  <div class="frow" style="text-align:left;margin-top:10px;"><label>Admin email</label><input id="emailInput" placeholder="you@jg-restoration.com"></div>
  <button class="btn acc" id="gateBtn" style="width:100%;">Continue</button>
</div>
<div class="toast" id="toast"></div>
<script>
const SB_URL='https://nuykvchgecpiuikoerze.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im51eWt2Y2hnZWNwaXVpa29lcnplIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYyNjM3ODYsImV4cCI6MjA5MTgzOTc4Nn0.39hZ8DdjT_0iFJXPeAL2FXUSLw8FZBirDVzxZTO1W9s';
// Roles allowed into Fleet — matches who gets the Fleet tile on the hub.
const FLEET_ROLES=['admin','office','project manager'];
// Fallback for pure-Google admin accounts that may not have an employees row.
const ADMIN_EMAILS=['josh@jg-restoration.com','josh.greil@jg-restoration.com','lisa@jg-restoration.com','jgimprovements@gmail.com'];
let sb=null,ME=null,VEHICLES=[],EMPLOYEES=[],ISSUES=[];

// Multi-role aware: employees.role is comma-separated ("Office, Admin"), so
// split and check for overlap rather than exact-matching the whole string.
function _hasFleetRole(roleStr){
  return String(roleStr||'').split(',').map(r=>r.trim().toLowerCase()).filter(Boolean).some(r=>FLEET_ROLES.indexOf(r)!==-1);
}
// Look the signer-in up on the roster and decide access by role. Anon key can
// read employees (same as every other page). Returns true if allowed.
async function _emailAllowed(email){
  if(ADMIN_EMAILS.indexOf(email)!==-1) return true;   // hardcoded admins always in
  try{
    const c=window.supabase.createClient(SB_URL,SB_KEY);
    const e=encodeURIComponent(email);
    const {data}=await c.from('employees').select('role,active').or('email.eq.'+email+',personal_email.eq.'+email).limit(1);
    const emp=data&&data[0];
    if(emp&&emp.active!==false&&_hasFleetRole(emp.role)) return true;
  }catch(err){/* fall through to deny */}
  return false;
}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),2600);}
function closeModal(id){document.getElementById(id).classList.remove('on');}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function detectEmail(){try{const r=localStorage.getItem('jg_platform_user')||localStorage.getItem('jg_tc_user');if(r){const u=JSON.parse(r);return u&&u.email?String(u.email).toLowerCase():null;}}catch(e){}return null;}

// Upload a vehicle photo to the shared storage bucket. Reuses the collision-proof
// path pattern ({timestamp}-{random}-{name}) that was hardened for photo uploads,
// so two uploads in the same millisecond can't overwrite each other. Returns the
// public URL, or null on failure.
async function uploadVehiclePhoto(file){
  if(!sb||!file) return null;
  const safe=(file.name||'photo.jpg').replace(/[^a-zA-Z0-9._-]/g,'_');
  const uniq=(crypto.randomUUID?crypto.randomUUID().slice(0,8):Math.random().toString(36).slice(2,10));
  const path='vehicles/'+Date.now()+'-'+uniq+'-'+safe;
  const {error}=await sb.storage.from('rebuild-documents').upload(path,file,{contentType:file.type||'image/jpeg',upsert:false});
  if(error){toast('Photo upload failed: '+error.message);return null;}
  return sb.storage.from('rebuild-documents').getPublicUrl(path).data.publicUrl;
}
function openGate(msg){document.getElementById('gate').style.display='block';document.getElementById('app').style.display='none';if(msg)document.getElementById('gateMsg').textContent=msg;const p=detectEmail();if(p)document.getElementById('emailInput').value=p;}
async function tryEnter(email){email=String(email||'').trim().toLowerCase();if(!email)return openGate('Enter your email.');const ok=await _emailAllowed(email);if(!ok)return openGate('Your account does not have Fleet access. Contact the office.');ME=email;document.getElementById('gate').style.display='none';document.getElementById('app').style.display='block';await boot();}
async function boot(){if(!window.supabase||!window.supabase.createClient){toast('Database library blocked - check tracking prevention');return;}sb=window.supabase.createClient(SB_URL,SB_KEY);await Promise.all([loadEmployees(),loadVehicles(),loadIssues()]);render();}
async function loadEmployees(){const {data}=await sb.from('employees').select('id,name,active').eq('active',true).order('name');EMPLOYEES=data||[];document.getElementById('fUsual').innerHTML='<option value="">- none / pool -</option>'+EMPLOYEES.map(e=>'<option value="'+e.id+'">'+esc(e.name)+'</option>').join('');}
async function loadVehicles(){const {data}=await sb.from('vehicles').select('*').order('name');VEHICLES=data||[];}
async function loadIssues(){const {data}=await sb.from('vehicle_issues').select('*').neq('status','resolved').order('reported_at',{ascending:false});ISSUES=data||[];document.getElementById('issueCount').textContent=ISSUES.length?'('+ISSUES.length+')':'';}
function daysUntil(d){if(!d)return null;return Math.round((new Date(d)-new Date())/86400000);}
function dueRow(label,d){const n=daysUntil(d);if(n===null)return '';let cls='',txt=d;if(n<0){cls='overdue';txt=d+' · OVERDUE';}else if(n<=30){cls='soon';txt=d+' · '+n+'d';}return '<div class="drow"><span>'+label+'</span><span class="'+cls+'">'+txt+'</span></div>';}
function oilDue(v){if(!v.current_mileage||!v.last_oil_mileage||!v.oil_interval_miles)return '';const next=v.last_oil_mileage+v.oil_interval_miles,left=next-v.current_mileage;let cls='',txt=next.toLocaleString()+' mi';if(left<0){cls='overdue';txt='OVERDUE '+Math.abs(left).toLocaleString()+' mi';}else if(left<=500){cls='soon';txt='due in '+left.toLocaleString()+' mi';}return '<div class="drow"><span>Oil change</span><span class="'+cls+'">'+txt+'</span></div>';}
function openIssuesFor(id){return ISSUES.filter(i=>i.vehicle_id===id);}
function render(){renderFleet();renderIssues();}
function renderFleet(){
  const q=(document.getElementById('search').value||'').toLowerCase().trim();
  const mf=document.getElementById('marketFilter').value,sf=document.getElementById('statusFilter').value;
  let list=VEHICLES.filter(v=>{if(mf&&v.market!==mf)return false;if(sf==='active_set'){if(v.status==='retired')return false;}else if(sf&&v.status!==sf)return false;if(q){const h=(v.name+' '+(v.plate||'')+' '+(v.vehicle_number||'')+' '+(v.make||'')+' '+(v.model||'')).toLowerCase();if(h.indexOf(q)===-1)return false;}return true;});
  const grid=document.getElementById('vgrid');
  if(!list.length){grid.innerHTML='<div class="empty">No vehicles yet. Click <b>+ Add Vehicle</b> to start.</div>';return;}
  const en=id=>{const e=EMPLOYEES.find(x=>x.id===id);return e?e.name:'';};
  grid.innerHTML=list.map(v=>{
    const iss=openIssuesFor(v.id);
    const due=[dueRow('Registration',v.registration_due),dueRow('Insurance',v.insurance_due),dueRow('DOT inspection',v.inspection_due),oilDue(v)].filter(Boolean).join('');
    return '<div class="vcard s-'+v.status+'">'+
      (v.photo_url?'<div style="width:100%;height:120px;border-radius:8px;margin-bottom:10px;background:#eef1f6 url('+esc(v.photo_url)+') center/cover no-repeat;"></div>':'')+
      '<h3>'+esc(v.name)+' <span class="badge '+v.status+'">'+v.status.replace('_',' ')+'</span></h3>'+
      '<div class="vmeta">'+([v.year,esc(v.make),esc(v.model)].filter(Boolean).join(' ')||'—')+' · '+(v.market?(v.market==='stevens_point'?'Stevens Point':'Appleton'):'no market')+(v.vehicle_number?' · #'+esc(v.vehicle_number):'')+'</div>'+
      '<div class="kv"><span>Plate</span><b>'+(esc(v.plate)||'—')+'</b></div>'+
      '<div class="kv"><span>Current mileage</span><b class="mono">'+(v.current_mileage?v.current_mileage.toLocaleString():'—')+'</b></div>'+
      '<div class="kv"><span>Usual driver</span><b>'+(esc(en(v.usual_assigned_to))||'pool')+'</b></div>'+
      (due?'<div class="due">'+due+'</div>':'')+
      (iss.length?'<div class="issue-flag">⚠ '+iss.length+' open issue'+(iss.length>1?'s':'')+': '+esc(iss[0].category||'')+(iss[0].note?' — '+esc(iss[0].note.slice(0,50)):'')+'</div>':'')+
      '<div class="vactions"><button class="btn sm ghost" onclick="editVehicle(\''+v.id+'\')">Edit</button><button class="btn sm acc" onclick="openService(\''+v.id+'\')">Log service</button></div></div>';
  }).join('');
}
function renderIssues(){
  const wrap=document.getElementById('issuesTab');
  if(!ISSUES.length){wrap.innerHTML='<div class="empty">No open issues.</div>';return;}
  const vn=id=>{const v=VEHICLES.find(x=>x.id===id);return v?v.name:'(unknown)';};
  wrap.innerHTML='<div class="section-hdr">Open Vehicle Issues</div>'+ISSUES.map(i=>'<div class="issue-card"><div><b style="color:var(--navy)">'+esc(vn(i.vehicle_id))+'</b> <span class="badge '+(i.severity==='urgent'?'flagged':'in_shop')+'">'+esc(i.category||'issue')+(i.severity==='urgent'?' · URGENT':'')+'</span><div style="font-size:13px;margin-top:4px">'+(esc(i.note)||'(no note)')+'</div><div style="font-size:11px;color:var(--muted);margin-top:3px">Reported by '+(esc(i.reported_by_name)||'?')+' · '+new Date(i.reported_at).toLocaleDateString()+' · '+esc(i.status)+'</div></div><div style="display:flex;gap:6px;align-items:flex-start;flex-wrap:wrap">'+(i.status==='open'?'<button class="btn sm ghost" onclick="ackIssue(\''+i.id+'\')">Acknowledge</button>':'')+'<button class="btn sm" onclick="resolveIssue(\''+i.id+'\')">Resolve</button></div></div>').join('');
}
function openAdd(){document.getElementById('vModalTitle').textContent='Add Vehicle';['vId','fName','fNumber','fYear','fMake','fModel','fPlate','fVin','fMileage','fLastOil','fReg','fIns','fInsp','fNotes','fPhotoUrl'].forEach(id=>document.getElementById(id).value='');document.getElementById('fMarket').value='';document.getElementById('fUsual').value='';document.getElementById('fStatus').value='active';document.getElementById('fOilInterval').value='5000';document.getElementById('fPhotoFile').value='';document.getElementById('photoStatus').textContent='For identification. JPG/PNG.';setPhotoPreview('');document.getElementById('vModal').classList.add('on');}
function editVehicle(id){const v=VEHICLES.find(x=>x.id===id);if(!v)return;document.getElementById('vModalTitle').textContent='Edit '+v.name;const set=(f,val)=>document.getElementById(f).value=val==null?'':val;set('vId',v.id);set('fName',v.name);set('fNumber',v.vehicle_number);set('fYear',v.year);set('fMake',v.make);set('fModel',v.model);set('fPlate',v.plate);set('fVin',v.vin);set('fMarket',v.market);set('fUsual',v.usual_assigned_to);set('fStatus',v.status);set('fMileage',v.current_mileage);set('fOilInterval',v.oil_interval_miles);set('fLastOil',v.last_oil_mileage);set('fReg',v.registration_due);set('fIns',v.insurance_due);set('fInsp',v.inspection_due);set('fNotes',v.notes);set('fPhotoUrl',v.photo_url);document.getElementById('fPhotoFile').value='';document.getElementById('photoStatus').textContent=v.photo_url?'Photo on file — pick a new one to replace':'For identification. JPG/PNG.';setPhotoPreview(v.photo_url);document.getElementById('vModal').classList.add('on');}
async function saveVehicle(){const g=id=>{const el=document.getElementById(id);const v=el.value.trim?el.value.trim():el.value;return v===''?null:v;};const name=g('fName');if(!name){toast('Name is required');return;}const row={name,vehicle_number:g('fNumber'),year:g('fYear')?parseInt(g('fYear')):null,make:g('fMake'),model:g('fModel'),plate:g('fPlate'),vin:g('fVin'),market:g('fMarket')||null,usual_assigned_to:g('fUsual')||null,status:g('fStatus')||'active',current_mileage:g('fMileage')?parseInt(g('fMileage')):null,oil_interval_miles:g('fOilInterval')?parseInt(g('fOilInterval')):null,last_oil_mileage:g('fLastOil')?parseInt(g('fLastOil')):null,registration_due:g('fReg'),insurance_due:g('fIns'),inspection_due:g('fInsp'),notes:g('fNotes'),photo_url:g('fPhotoUrl'),updated_at:new Date().toISOString()};const id=g('vId');let err;if(id){({error:err}=await sb.from('vehicles').update(row).eq('id',id));}else{({error:err}=await sb.from('vehicles').insert(row));}if(err){toast('Save failed: '+err.message);return;}closeModal('vModal');await loadVehicles();render();toast('Saved');}
function openService(vid){const v=VEHICLES.find(x=>x.id===vid);document.getElementById('sModalTitle').textContent='Service — '+(v?v.name:'');document.getElementById('sVehicleId').value=vid;['sMileage','sCost','sVendor','sNote'].forEach(id=>document.getElementById(id).value='');document.getElementById('sDate').value=new Date().toISOString().slice(0,10);document.getElementById('sType').value='oil';if(v&&v.current_mileage)document.getElementById('sMileage').value=v.current_mileage;loadServiceHistory(vid);document.getElementById('sModal').classList.add('on');}
async function loadServiceHistory(vid){const {data}=await sb.from('vehicle_maintenance_log').select('*').eq('vehicle_id',vid).order('service_date',{ascending:false}).limit(10);const h=document.getElementById('sHistory');if(!data||!data.length){h.innerHTML='<div style="font-size:12px;color:var(--muted);margin-top:6px">No service history yet.</div>';return;}h.innerHTML='<div class="section-hdr" style="margin-top:12px">Recent Service</div>'+data.map(s=>'<div class="hist-row"><span>'+s.service_date+' · '+esc(s.service_type||'')+(s.mileage_at_service?' · '+s.mileage_at_service.toLocaleString()+'mi':'')+'</span><b class="mono">'+(s.cost!=null?'$'+Number(s.cost).toFixed(2):'')+'</b></div>').join('');}
async function saveService(){const g=id=>{const v=document.getElementById(id).value;return v===''?null:v;};const vid=g('sVehicleId'),date=g('sDate');if(!date){toast('Date required');return;}const type=g('sType'),mileage=g('sMileage')?parseInt(g('sMileage')):null;const {error}=await sb.from('vehicle_maintenance_log').insert({vehicle_id:vid,service_date:date,service_type:type,mileage_at_service:mileage,cost:g('sCost')?parseFloat(g('sCost')):null,vendor:g('sVendor'),note:g('sNote'),created_by:ME});if(error){toast('Failed: '+error.message);return;}if(type==='oil'&&mileage){await sb.from('vehicles').update({last_oil_mileage:mileage,last_oil_date:date,updated_at:new Date().toISOString()}).eq('id',vid);await loadVehicles();}toast('Service logged');loadServiceHistory(vid);render();}
async function ackIssue(id){await sb.from('vehicle_issues').update({status:'acknowledged',acknowledged_by:ME,acknowledged_at:new Date().toISOString()}).eq('id',id);await loadIssues();render();toast('Acknowledged');}
async function resolveIssue(id){const note=prompt('Resolution note (optional):')||'';const iss=ISSUES.find(x=>x.id===id);await sb.from('vehicle_issues').update({status:'resolved',resolved_by:ME,resolved_at:new Date().toISOString(),resolution_note:note}).eq('id',id);if(iss){const remaining=ISSUES.filter(x=>x.vehicle_id===iss.vehicle_id&&x.id!==id&&x.status!=='resolved');const v=VEHICLES.find(x=>x.id===iss.vehicle_id);if(v&&v.status==='flagged'&&!remaining.length){await sb.from('vehicles').update({status:'active'}).eq('id',v.id);await loadVehicles();}}await loadIssues();render();toast('Resolved');}
function showTab(t){document.getElementById('fleetTab').style.display=t==='fleet'?'':'none';document.getElementById('issuesTab').style.display=t==='issues'?'':'none';document.getElementById('tabFleet').classList.toggle('active',t==='fleet');document.getElementById('tabIssues').classList.toggle('active',t==='issues');}
document.getElementById('tabFleet').onclick=()=>showTab('fleet');
document.getElementById('tabIssues').onclick=()=>showTab('issues');
document.getElementById('addBtn').onclick=openAdd;
// Photo pick → upload immediately, preview, stash URL for save.
document.getElementById('fPhotoFile').addEventListener('change',async function(e){
  const file=e.target.files&&e.target.files[0];if(!file)return;
  document.getElementById('photoStatus').textContent='Uploading…';
  const url=await uploadVehiclePhoto(file);
  if(url){document.getElementById('fPhotoUrl').value=url;setPhotoPreview(url);document.getElementById('photoStatus').textContent='Uploaded ✓';}
  else{document.getElementById('photoStatus').textContent='Upload failed — try again';}
});
function setPhotoPreview(url){const p=document.getElementById('photoPreview');if(url){p.style.backgroundImage='url('+url+')';p.textContent='';}else{p.style.backgroundImage='';p.textContent='🚐';}}
document.getElementById('saveVehicle').onclick=saveVehicle;
document.getElementById('saveService').onclick=saveService;
['search','marketFilter','statusFilter'].forEach(id=>document.getElementById(id).addEventListener('input',renderFleet));
document.getElementById('gateBtn').onclick=()=>tryEnter(document.getElementById('emailInput').value);
(function(){const e=detectEmail();if(e)tryEnter(e);else openGate('');})();
</script>
</body>
</html>
