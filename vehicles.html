<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fleet · JG Restoration</title>
<link rel="icon" href="https://jgimprovements-arch.github.io/jg-dispatch/logo.png" type="image/png">
<style>
  :root{
    --navy:#0d2d5e; --navy2:#12386f; --orange:#e8930c; --line:#dce3ee; --muted:#6b7a90;
    --ok:#2d9c5f; --warn:#e08a00; --err:#d64545; --bg:#f4f6fa; --card:#fff;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:#17233a;line-height:1.45}
  .wrap{max-width:1100px;margin:0 auto;padding:20px 16px 90px}
  header{display:flex;align-items:center;gap:12px;margin-bottom:4px;flex-wrap:wrap}
  header img{height:32px}
  h1{font-size:20px;margin:0}
  .sub{color:var(--muted);font-size:13px;margin:2px 0 18px}
  .bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
  .bar .grow{flex:1}
  input,select,textarea{font-family:inherit;font-size:14px;padding:9px 11px;border:1px solid var(--line);border-radius:8px;width:100%}
  textarea{resize:vertical;min-height:60px}
  button{background:var(--navy);color:#fff;border:0;border-radius:8px;padding:9px 16px;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap}
  button:hover{background:var(--navy2)}
  button.ghost{background:#fff;color:var(--navy);border:1px solid var(--line)}
  button.orange{background:var(--orange)}button.orange:hover{filter:brightness(.95)}
  button.sm{padding:5px 10px;font-size:12px}
  button.danger{background:#fff;color:var(--err);border:1px solid #f0c4c4}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px}
  .vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
  .vcard{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;position:relative;border-left:4px solid var(--line)}
  .vcard.status-active{border-left-color:var(--ok)}
  .vcard.status-in_shop{border-left-color:var(--warn)}
  .vcard.status-flagged{border-left-color:var(--err)}
  .vcard.status-retired{border-left-color:#aab4c4;opacity:.72}
  .vcard h3{margin:0 0 2px;font-size:16px;display:flex;align-items:center;gap:8px}
  .vmeta{font-size:12px;color:var(--muted);margin-bottom:8px}
  .pill{display:inline-block;font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;text-transform:uppercase;letter-spacing:.05em;font-family:"DM Mono",ui-monospace,monospace}
  .pill.active{background:rgba(45,156,95,.14);color:var(--ok)}
  .pill.in_shop{background:rgba(224,138,0,.16);color:var(--warn)}
  .pill.flagged{background:rgba(214,69,69,.14);color:var(--err)}
  .pill.retired{background:#eceff4;color:#7a879b}
  .kv{display:flex;justify-content:space-between;font-size:13px;padding:3px 0;border-bottom:1px dashed #eef1f6}
  .kv b{font-weight:600}
  .due{font-size:12px;margin-top:8px}
  .due .row{display:flex;justify-content:space-between;padding:2px 0}
  .due .overdue{color:var(--err);font-weight:700}
  .due .soon{color:var(--warn);font-weight:600}
  .vactions{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
  .issue-flag{background:rgba(214,69,69,.08);border:1px solid #f0c4c4;border-radius:8px;padding:6px 9px;font-size:12px;color:#a12b2b;margin-top:8px}
  /* modal */
  .modal-back{position:fixed;inset:0;background:rgba(13,29,60,.5);display:none;align-items:flex-start;justify-content:center;z-index:600;padding:24px 12px;overflow:auto}
  .modal-back.on{display:flex}
  .modal{background:#fff;border-radius:14px;width:100%;max-width:560px;padding:18px 20px}
  .modal h2{margin:0 0 12px;font-size:17px}
  .frow{margin-bottom:10px}
  .frow label{display:block;font-size:12px;font-weight:600;color:#33405a;margin-bottom:4px}
  .f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .f3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:14px}
  .empty{color:var(--muted);text-align:center;padding:40px 0}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:10px;font-size:14px;z-index:800;opacity:0;transition:opacity .2s;pointer-events:none}
  .toast.on{opacity:1}
  .tabs{display:flex;gap:6px;margin-bottom:14px}
  .tabs button{background:#fff;color:var(--navy);border:1px solid var(--line)}
  .tabs button.active{background:var(--navy);color:#fff}
  .gate{background:#fff;border:1px solid var(--line);border-radius:12px;padding:22px;text-align:center;max-width:440px;margin:60px auto}
  .hist-row{display:flex;justify-content:space-between;font-size:13px;padding:6px 0;border-bottom:1px solid #eef1f6}
</style>
</head>
<body>
<div class="wrap" id="app" style="display:none">
  <header>
    <img src="https://jgimprovements-arch.github.io/jg-dispatch/logo.png" alt="">
    <h1>Fleet</h1>
    <div style="flex:1"></div>
    <button class="orange" id="addBtn">+ Add Vehicle</button>
  </header>
  <div class="sub">Add and maintain the vehicle list, service schedules, and open repair issues. Daily tech assignments happen on the dispatch board.</div>

  <div class="tabs">
    <button class="active" data-tab="fleet" id="tabFleet">Fleet</button>
    <button data-tab="issues" id="tabIssues">Open Issues <span id="issueCount"></span></button>
  </div>

  <!-- FLEET TAB -->
  <div id="fleetTab">
    <div class="bar">
      <input class="grow" id="search" placeholder="Search name, plate, number…" style="max-width:320px">
      <select id="marketFilter" style="max-width:180px">
        <option value="">All markets</option>
        <option value="appleton">Appleton</option>
        <option value="stevens_point">Stevens Point</option>
      </select>
      <select id="statusFilter" style="max-width:180px">
        <option value="active_set">Active + In Shop</option>
        <option value="">All (incl. retired)</option>
        <option value="active">Active only</option>
        <option value="in_shop">In shop</option>
        <option value="flagged">Flagged</option>
        <option value="retired">Retired</option>
      </select>
    </div>
    <div class="vgrid" id="vgrid"></div>
  </div>

  <!-- ISSUES TAB -->
  <div id="issuesTab" style="display:none"></div>
</div>

<!-- ADD/EDIT MODAL -->
<div class="modal-back" id="vModal">
  <div class="modal">
    <h2 id="vModalTitle">Add Vehicle</h2>
    <input type="hidden" id="vId">
    <div class="f2">
      <div class="frow"><label>Name *</label><input id="fName" placeholder="Van 3"></div>
      <div class="frow"><label>Fleet #</label><input id="fNumber" placeholder="V-03"></div>
    </div>
    <div class="f3">
      <div class="frow"><label>Year</label><input id="fYear" type="number" placeholder="2021"></div>
      <div class="frow"><label>Make</label><input id="fMake" placeholder="Ford"></div>
      <div class="frow"><label>Model</label><input id="fModel" placeholder="Transit"></div>
    </div>
    <div class="f2">
      <div class="frow"><label>Plate</label><input id="fPlate"></div>
      <div class="frow"><label>VIN</label><input id="fVin"></div>
    </div>
    <div class="f2">
      <div class="frow"><label>Market</label>
        <select id="fMarket"><option value="">—</option><option value="appleton">Appleton</option><option value="stevens_point">Stevens Point</option></select>
      </div>
      <div class="frow"><label>Usual driver (dedicated)</label><select id="fUsual"><option value="">— none / pool —</option></select></div>
    </div>
    <div class="f2">
      <div class="frow"><label>Status</label>
        <select id="fStatus"><option value="active">Active</option><option value="in_shop">In shop</option><option value="flagged">Flagged</option><option value="retired">Retired</option></select>
      </div>
      <div class="frow"><label>Current mileage</label><input id="fMileage" type="number"></div>
    </div>
    <div class="f2">
      <div class="frow"><label>Oil interval (mi)</label><input id="fOilInterval" type="number" placeholder="5000"></div>
      <div class="frow"><label>Last oil @ mileage</label><input id="fLastOil" type="number"></div>
    </div>
    <div class="f3">
      <div class="frow"><label>Registration due</label><input id="fReg" type="date"></div>
      <div class="frow"><label>Insurance due</label><input id="fIns" type="date"></div>
      <div class="frow"><label>DOT inspection due</label><input id="fInsp" type="date"></div>
    </div>
    <div class="frow"><label>Notes</label><textarea id="fNotes"></textarea></div>
    <div class="modal-actions">
      <button class="ghost" onclick="closeModal('vModal')">Cancel</button>
      <button id="saveVehicle">Save</button>
    </div>
  </div>
</div>

<!-- SERVICE LOG MODAL -->
<div class="modal-back" id="sModal">
  <div class="modal">
    <h2 id="sModalTitle">Log Service</h2>
    <input type="hidden" id="sVehicleId">
    <div class="f2">
      <div class="frow"><label>Date *</label><input id="sDate" type="date"></div>
      <div class="frow"><label>Type</label>
        <select id="sType"><option>oil</option><option>tires</option><option>brakes</option><option>registration</option><option>insurance</option><option>inspection</option><option>repair</option><option>other</option></select>
      </div>
    </div>
    <div class="f2">
      <div class="frow"><label>Mileage at service</label><input id="sMileage" type="number"></div>
      <div class="frow"><label>Cost ($)</label><input id="sCost" type="number" step="0.01"></div>
    </div>
    <div class="frow"><label>Vendor</label><input id="sVendor"></div>
    <div class="frow"><label>Note</label><textarea id="sNote"></textarea></div>
    <div id="sHistory" style="margin-top:6px"></div>
    <div class="modal-actions">
      <button class="ghost" onclick="closeModal('sModal')">Close</button>
      <button id="saveService">Save Service</button>
    </div>
  </div>
</div>

<div class="gate" id="gate">
  <h1 style="font-size:18px;margin:0 0 6px">Fleet</h1>
  <p style="color:#6b7a90;font-size:13px">Open while signed in to the JG platform as an admin.</p>
  <p id="gateMsg" style="color:#d64545;font-size:13px"></p>
  <div class="frow" style="text-align:left"><label>Admin email</label><input id="emailInput" placeholder="you@jg-restoration.com"></div>
  <button id="gateBtn">Continue</button>
</div>

<div class="toast" id="toast"></div>

<script>
const SB_URL='https://nuykvchgecpiuikoerze.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im51eWt2Y2hnZWNwaXVpa29lcnplIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYyNjM3ODYsImV4cCI6MjA5MTgzOTc4Nn0.39hZ8DdjT_0iFJXPeAL2FXUSLw8FZBirDVzxZTO1W9s';
const ADMIN_EMAILS=['josh@jg-restoration.com','josh.greil@jg-restoration.com','lisa@jg-restoration.com'];
let sb=null, ADMIN=null, VEHICLES=[], EMPLOYEES=[], ISSUES=[];

function loadScript(srcs){return new Promise((res,rej)=>{let i=0;(function n(){if(i>=srcs.length)return rej(new Error('cdn'));const s=document.createElement('script');s.src=srcs[i++];s.onload=res;s.onerror=()=>{s.remove();n();};document.head.appendChild(s);})();});}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),2600);}
function closeModal(id){document.getElementById(id).classList.remove('on');}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function detectEmail(){try{const r=localStorage.getItem('jg_platform_user')||localStorage.getItem('jg_tc_user');if(r){const u=JSON.parse(r);return u&&u.email?String(u.email).toLowerCase():null;}}catch(e){}return null;}

function openGate(msg){document.getElementById('gate').style.display='block';document.getElementById('app').style.display='none';if(msg)document.getElementById('gateMsg').textContent=msg;const p=detectEmail();if(p)document.getElementById('emailInput').value=p;}
async function tryEnter(email){email=String(email||'').trim().toLowerCase();if(!email)return openGate('Enter your admin email.');if(ADMIN_EMAILS.indexOf(email)===-1)return openGate('That email is not an admin.');ADMIN=email;document.getElementById('gate').style.display='none';document.getElementById('app').style.display='block';await boot();}

async function boot(){
  try{await loadScript(['https://unpkg.com/@supabase/supabase-js@2','https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2']);sb=window.supabase.createClient(SB_URL,SB_KEY);}
  catch(e){return toast('Could not load database library');}
  await Promise.all([loadEmployees(), loadVehicles(), loadIssues()]);
  render();
}

async function loadEmployees(){const {data}=await sb.from('employees').select('id,name,role,active').eq('active',true).order('name');EMPLOYEES=data||[];
  const sel=document.getElementById('fUsual');sel.innerHTML='<option value="">— none / pool —</option>'+EMPLOYEES.map(e=>`<option value="${e.id}">${esc(e.name)}</option>`).join('');}
async function loadVehicles(){const {data}=await sb.from('vehicles').select('*').order('name');VEHICLES=data||[];}
async function loadIssues(){const {data}=await sb.from('vehicle_issues').select('*').neq('status','resolved').order('reported_at',{ascending:false});ISSUES=data||[];
  const c=document.getElementById('issueCount');c.textContent=ISSUES.length?`(${ISSUES.length})`:'';}

// ---- due-date / mileage helpers ----
function daysUntil(d){if(!d)return null;const diff=(new Date(d)-new Date())/86400000;return Math.round(diff);}
function dueRow(label,d){const n=daysUntil(d);if(n===null)return '';let cls='',txt=d;if(n<0){cls='overdue';txt=d+' · OVERDUE';}else if(n<=30){cls='soon';txt=d+` · ${n}d`;}return `<div class="row"><span>${label}</span><span class="${cls}">${txt}</span></div>`;}
function oilDue(v){if(!v.current_mileage||!v.last_oil_mileage||!v.oil_interval_miles)return '';const next=v.last_oil_mileage+v.oil_interval_miles;const left=next-v.current_mileage;let cls='',txt=`${next.toLocaleString()} mi`;if(left<0){cls='overdue';txt=`OVERDUE by ${Math.abs(left).toLocaleString()} mi`;}else if(left<=500){cls='soon';txt=`due in ${left.toLocaleString()} mi`;}return `<div class="row"><span>Oil change</span><span class="${cls}">${txt}</span></div>`;}

function openIssuesFor(vid){return ISSUES.filter(i=>i.vehicle_id===vid);}

// ---- render ----
function render(){renderFleet();renderIssues();}
function renderFleet(){
  const q=(document.getElementById('search').value||'').toLowerCase().trim();
  const mf=document.getElementById('marketFilter').value;
  const sf=document.getElementById('statusFilter').value;
  let list=VEHICLES.filter(v=>{
    if(mf&&v.market!==mf)return false;
    if(sf==='active_set'){if(['retired'].includes(v.status))return false;}
    else if(sf&&v.status!==sf)return false;
    if(q){const hay=(v.name+' '+(v.plate||'')+' '+(v.vehicle_number||'')+' '+(v.make||'')+' '+(v.model||'')).toLowerCase();if(hay.indexOf(q)===-1)return false;}
    return true;
  });
  const grid=document.getElementById('vgrid');
  if(!list.length){grid.innerHTML='<div class="empty">No vehicles. Click <b>+ Add Vehicle</b> to start.</div>';return;}
  const empName=id=>{const e=EMPLOYEES.find(x=>x.id===id);return e?e.name:'';};
  grid.innerHTML=list.map(v=>{
    const iss=openIssuesFor(v.id);
    const due=[dueRow('Registration',v.registration_due),dueRow('Insurance',v.insurance_due),dueRow('DOT inspection',v.inspection_due),oilDue(v)].filter(Boolean).join('');
    return `<div class="vcard status-${v.status}">
      <h3>${esc(v.name)} <span class="pill ${v.status}">${v.status.replace('_',' ')}</span></h3>
      <div class="vmeta">${[v.year,esc(v.make),esc(v.model)].filter(Boolean).join(' ')||'—'} · ${v.market?(v.market==='stevens_point'?'Stevens Point':'Appleton'):'no market'}${v.vehicle_number?' · #'+esc(v.vehicle_number):''}</div>
      <div class="kv"><span>Plate</span><b>${esc(v.plate)||'—'}</b></div>
      <div class="kv"><span>Current mileage</span><b>${v.current_mileage?v.current_mileage.toLocaleString():'—'}</b></div>
      <div class="kv"><span>Usual driver</span><b>${esc(empName(v.usual_assigned_to))||'pool'}</b></div>
      ${due?`<div class="due">${due}</div>`:''}
      ${iss.length?`<div class="issue-flag">⚠ ${iss.length} open issue${iss.length>1?'s':''}: ${esc(iss[0].category||'')}${iss[0].note?' — '+esc(iss[0].note.slice(0,50)):''}</div>`:''}
      <div class="vactions">
        <button class="sm ghost" onclick="editVehicle('${v.id}')">Edit</button>
        <button class="sm orange" onclick="openService('${v.id}')">Log service</button>
      </div>
    </div>`;
  }).join('');
}

function renderIssues(){
  const wrap=document.getElementById('issuesTab');
  if(!ISSUES.length){wrap.innerHTML='<div class="empty">No open issues. 🎉</div>';return;}
  const vName=id=>{const v=VEHICLES.find(x=>x.id===id);return v?v.name:'(unknown)';};
  wrap.innerHTML=ISSUES.map(i=>`<div class="card">
    <div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap">
      <div>
        <b>${esc(vName(i.vehicle_id))}</b> <span class="pill ${i.severity==='urgent'?'flagged':'in_shop'}">${esc(i.category||'issue')}${i.severity==='urgent'?' · URGENT':''}</span>
        <div style="font-size:13px;margin-top:4px">${esc(i.note)||'(no note)'}</div>
        <div style="font-size:11px;color:#6b7a90;margin-top:3px">Reported by ${esc(i.reported_by_name)||'?'} · ${new Date(i.reported_at).toLocaleDateString()} · status: ${esc(i.status)}</div>
      </div>
      <div style="display:flex;gap:6px;align-items:flex-start;flex-wrap:wrap">
        ${i.status==='open'?`<button class="sm ghost" onclick="ackIssue('${i.id}')">Acknowledge</button>`:''}
        <button class="sm" onclick="resolveIssue('${i.id}')">Resolve</button>
      </div>
    </div>
  </div>`).join('');
}

// ---- vehicle CRUD ----
function openAdd(){document.getElementById('vModalTitle').textContent='Add Vehicle';['vId','fName','fNumber','fYear','fMake','fModel','fPlate','fVin','fMileage','fLastOil','fReg','fIns','fInsp','fNotes'].forEach(id=>document.getElementById(id).value='');document.getElementById('fMarket').value='';document.getElementById('fUsual').value='';document.getElementById('fStatus').value='active';document.getElementById('fOilInterval').value='5000';document.getElementById('vModal').classList.add('on');}
function editVehicle(id){const v=VEHICLES.find(x=>x.id===id);if(!v)return;document.getElementById('vModalTitle').textContent='Edit '+v.name;
  const set=(f,val)=>document.getElementById(f).value=val==null?'':val;
  set('vId',v.id);set('fName',v.name);set('fNumber',v.vehicle_number);set('fYear',v.year);set('fMake',v.make);set('fModel',v.model);set('fPlate',v.plate);set('fVin',v.vin);set('fMarket',v.market);set('fUsual',v.usual_assigned_to);set('fStatus',v.status);set('fMileage',v.current_mileage);set('fOilInterval',v.oil_interval_miles);set('fLastOil',v.last_oil_mileage);set('fReg',v.registration_due);set('fIns',v.insurance_due);set('fInsp',v.inspection_due);set('fNotes',v.notes);
  document.getElementById('vModal').classList.add('on');}

async function saveVehicle(){
  const g=id=>{const el=document.getElementById(id);const v=el.value.trim?el.value.trim():el.value;return v===''?null:v;};
  const name=g('fName');if(!name){toast('Name is required');return;}
  const row={
    name, vehicle_number:g('fNumber'),
    year:g('fYear')?parseInt(g('fYear')):null, make:g('fMake'), model:g('fModel'),
    plate:g('fPlate'), vin:g('fVin'), market:g('fMarket')||null,
    usual_assigned_to:g('fUsual')||null, status:g('fStatus')||'active',
    current_mileage:g('fMileage')?parseInt(g('fMileage')):null,
    oil_interval_miles:g('fOilInterval')?parseInt(g('fOilInterval')):null,
    last_oil_mileage:g('fLastOil')?parseInt(g('fLastOil')):null,
    registration_due:g('fReg'), insurance_due:g('fIns'), inspection_due:g('fInsp'),
    notes:g('fNotes'), updated_at:new Date().toISOString()
  };
  const id=g('vId');
  let err;
  if(id){({error:err}=await sb.from('vehicles').update(row).eq('id',id));}
  else {({error:err}=await sb.from('vehicles').insert(row));}
  if(err){toast('Save failed: '+err.message);return;}
  closeModal('vModal');await loadVehicles();render();toast('Saved');
}

// ---- service log ----
function openService(vid){const v=VEHICLES.find(x=>x.id===vid);document.getElementById('sModalTitle').textContent='Service — '+(v?v.name:'');document.getElementById('sVehicleId').value=vid;
  ['sMileage','sCost','sVendor','sNote'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('sDate').value=new Date().toISOString().slice(0,10);document.getElementById('sType').value='oil';
  if(v&&v.current_mileage)document.getElementById('sMileage').value=v.current_mileage;
  loadServiceHistory(vid);
  document.getElementById('sModal').classList.add('on');}
async function loadServiceHistory(vid){const {data}=await sb.from('vehicle_maintenance_log').select('*').eq('vehicle_id',vid).order('service_date',{ascending:false}).limit(10);
  const h=document.getElementById('sHistory');
  if(!data||!data.length){h.innerHTML='<div style="font-size:12px;color:#6b7a90">No service history yet.</div>';return;}
  h.innerHTML='<div style="font-size:12px;font-weight:700;margin:8px 0 4px;color:#33405a">Recent service</div>'+data.map(s=>`<div class="hist-row"><span>${s.service_date} · ${esc(s.service_type||'')}${s.mileage_at_service?' · '+s.mileage_at_service.toLocaleString()+'mi':''}</span><b>${s.cost!=null?'$'+Number(s.cost).toFixed(2):''}</b></div>`).join('');}
async function saveService(){
  const g=id=>{const v=document.getElementById(id).value;return v===''?null:v;};
  const vid=g('sVehicleId'),date=g('sDate');if(!date){toast('Date required');return;}
  const type=g('sType');const mileage=g('sMileage')?parseInt(g('sMileage')):null;
  const row={vehicle_id:vid,service_date:date,service_type:type,mileage_at_service:mileage,cost:g('sCost')?parseFloat(g('sCost')):null,vendor:g('sVendor'),note:g('sNote'),created_by:ADMIN};
  const {error}=await sb.from('vehicle_maintenance_log').insert(row);
  if(error){toast('Failed: '+error.message);return;}
  // If oil change, roll the vehicle's oil baseline forward automatically.
  if(type==='oil'&&mileage){await sb.from('vehicles').update({last_oil_mileage:mileage,last_oil_date:date,updated_at:new Date().toISOString()}).eq('id',vid);await loadVehicles();}
  toast('Service logged');loadServiceHistory(vid);render();
}

// ---- issues ----
async function ackIssue(id){await sb.from('vehicle_issues').update({status:'acknowledged',acknowledged_by:ADMIN,acknowledged_at:new Date().toISOString()}).eq('id',id);await loadIssues();render();toast('Acknowledged');}
async function resolveIssue(id){const note=prompt('Resolution note (optional):')||'';await sb.from('vehicle_issues').update({status:'resolved',resolved_by:ADMIN,resolved_at:new Date().toISOString(),resolution_note:note}).eq('id',id);
  // If no more open issues on that vehicle and it was flagged, clear the flag.
  const iss=ISSUES.find(x=>x.id===id);if(iss){const remaining=ISSUES.filter(x=>x.vehicle_id===iss.vehicle_id&&x.id!==id&&x.status!=='resolved');const v=VEHICLES.find(x=>x.id===iss.vehicle_id);if(v&&v.status==='flagged'&&!remaining.length){await sb.from('vehicles').update({status:'active'}).eq('id',v.id);await loadVehicles();}}
  await loadIssues();render();toast('Resolved');}

// ---- tabs + wiring ----
function showTab(t){document.getElementById('fleetTab').style.display=t==='fleet'?'':'none';document.getElementById('issuesTab').style.display=t==='issues'?'':'none';document.getElementById('tabFleet').classList.toggle('active',t==='fleet');document.getElementById('tabIssues').classList.toggle('active',t==='issues');}
document.getElementById('tabFleet').onclick=()=>showTab('fleet');
document.getElementById('tabIssues').onclick=()=>showTab('issues');
document.getElementById('addBtn').onclick=openAdd;
document.getElementById('saveVehicle').onclick=saveVehicle;
document.getElementById('saveService').onclick=saveService;
['search','marketFilter','statusFilter'].forEach(id=>document.getElementById(id).addEventListener('input',renderFleet));
document.getElementById('gateBtn').onclick=()=>tryEnter(document.getElementById('emailInput').value);

(function(){const e=detectEmail();if(e&&ADMIN_EMAILS.indexOf(e)!==-1)tryEnter(e);else openGate('');})();
</script>
